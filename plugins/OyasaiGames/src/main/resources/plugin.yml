name: OyasaiGames
version: ${version}
main: icu.oyasai.games.OyasaiGamesPlugin
api-version: "1.21"
author: ukieo
description: おやさい鯖 ミニゲーム・生活アイテム・武器・PvP・BedWars・TNTRun統合プラットフォーム (OyasaiGames)
softdepend: [Vault, SlotMachine, CrackShot, pvparena, WorldEdit, FastAsyncWorldEdit, BedWars, ScreamingBedWars, SBA, TNTRun_reloaded, Multiverse-Core]
commands:
  bw:
    description: BedWars の参加・退出・統計・参加GUI
    aliases: [bedwars]
    permission: oyasaigames.bedwars.use
  bwparty:
    description: BedWars パーティー
    aliases: [party]
    permission: oyasaigames.bedwars.use
  shout:
    description: BedWars 試合内全体チャット
    permission: oyasaigames.bedwars.use
  tntrun:
    description: TNTRun の参加・退出・統計・一覧
    aliases: [tr]
  oslot:
    description: スロット台の一覧・情報・再読み込み
    permission: oyasaigames.slot.admin
  shot:
    description: 武器の一覧・配布・装填を行います
    permission: oyasaigames.weapons.admin
  pa:
    description: PvP アリーナへの参加・観戦・管理
    aliases: [pvparena, ogpa]
  oyasaigames:
    description: おやさいゲームズのメニューを開きます
    aliases: [games, og]
    permission: oyasaigames.use
  roulette:
    description: 建築用アイテム抽選ルーレットGUIを開きます
    aliases: [oroulette]
    permission: oyasaigames.roulette.use
  headhunt:
    description: HeadHuntのメインコマンドです。
    aliases: [hhunt]
  joingame:
    usage: "/joingame <text>"
  leavegame:
    description: 自身の参加予約をキャンセルします
    usage: "/leavegame"
  startgame:
    usage: "/startgame"
  givemission:
    usage: "/givemission <player>"
    permission: op
    permission-message: "§cYou don't have the required permission to use this command"
  checkmission:
    usage: "/checkmission <number> <number> <number> <text>"
  setteam:
    usage: "/setteam <player> <text>"
    permission: op
    permission-message: "§cYou don't have the required permission to use this command"
  clearteams:
    usage: "/clearteams"
    permission: op
    permission-message: "§cYou don't have the required permission to use this command"
  points:
    description: 自分または指定したプレイヤーのポイントを確認します
    usage: "/points [<player>]"
  eventstats:
    description: イベントポイントを持つ全プレイヤーの統計を表示します
    usage: "/eventstats"
    permission: op
    permission-message: "§cYou don't have the required permission to use this command"
  editpoints:
    description: プレイヤーのポイントを増減・設定します
    usage: "/editpoints <add|remove|set> <プレイヤー> <discovery|kill|event> <数値>"
    permission: op
    permission-message: "§cYou don't have the required permission to use this command"
  stopgame:
    description: 進行中のゲームを強制終了し、プレイヤーをロビーへ戻します
    usage: "/stopgame"
    permission: op
    permission-message: "§cYou don't have the required permission to use this command"
  recovergameplayer:
    description: 未復元のゲーム用スナップショットを手動復元します
    usage: "/recovergameplayer <player>"
    permission: op
    permission-message: "§cYou don't have the required permission to use this command"
permissions:
  oyasaigames.bedwars.use:
    default: true
  tntrun.join:
    default: true
  tntrun.party:
    default: true
  tntrun.shop:
    default: true
  slotmachine.access.default:
    description: 標準スロット台の利用
    default: true
  oyasaigames.slot.admin:
    description: スロット台の管理
    default: op
  oyasaigames.weapons.admin:
    description: 武器の管理コマンドを使用できます
    default: op
  oyasaigames.pvp.use:
    default: true
  oyasaigames.pvp.admin:
    default: op
  op:
    default: op
  oyasaigames.use:
    description: おやさいゲームズを使用する権限
    default: true
  oyasaigames.admin:
    description: おやさいゲームズの管理権限
    default: op
  oyasaigames.roulette.use:
    description: ルーレットを使用する権限
    default: true
  oyasaigames.roulette.admin:
    description: ルーレットの管理権限
    default: op
  headhunt.admin:
    description: HeadHuntの管理コマンドを使用できます。
    default: op
  headhunt.use:
    description: HeadHuntの基本コマンドを使用できます。
    default: true
  oyasaigames.roulette.special:
    description: 匠ランク特典の特殊ブロック（コマンドブロック等）解放権限
    default: op
