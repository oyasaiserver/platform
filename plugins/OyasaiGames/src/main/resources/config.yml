# ==============================================================================
#  OyasaiGames - Configuration
#  おやさい鯖 ミニゲーム統合プラットフォーム 設定ファイル
# ==============================================================================

# ゲームモジュールごとの有効/無効
games:
  headhunt:
    enabled: true
  slot:
    enabled: true
  weapons:
    enabled: true
  pvp:
    enabled: true
  bedwars:
    # Legacy migration is opt-in; stop external BedWars before enabling.
    enabled: false
  tntrun:
    enabled: true
  roulette:
    enabled: true

# ------------------------------------------------------------------------------
# 建築用アイテム抽選ルーレット設定
# ------------------------------------------------------------------------------
roulette:
  # クールダウン時間（秒単位、0で無効化）
  cooldown-seconds: 10

  # 全体公開時の効果音
  broadcast:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.2

# 旧エンジンの非公開換算との比較・調整用。初期値は互換性を保証しません。
weapons:
  compatibility:
    projectile-speed-scale: 0.1
    recoil-scale: 0.1
    knockback-scale: 0.1
    spread-scale: 0.1
