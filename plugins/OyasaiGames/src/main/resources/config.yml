# ==============================================================================
#  OyasaiGames - Configuration
#  おやさい鯖 ミニゲーム統合プラットフォーム 設定ファイル
# ==============================================================================

# ゲームモジュールごとの有効/無効
games:
  roulette:
    enabled: true

# ------------------------------------------------------------------------------
# 建築用アイテム抽選ルーレット設定
# ------------------------------------------------------------------------------
roulette:
  # クールダウン時間（秒単位、0で無効化）
  cooldown-seconds: 10

  # 全体公開時の効果音
  broadcast:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.2
