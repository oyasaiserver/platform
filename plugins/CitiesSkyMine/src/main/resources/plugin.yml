name: CitiesSkyMine
description: "CitiesSkyMine Plugin"
authors: [marzipan]
main: icu.oyasai.citiesskymine.Main
api-version: "1.21"
version: "0.2.0"
depend:
  - FastAsyncWorldEdit
softdepend:
  - LuckPerms
  - PlaceholderAPI

commands:
  csm:
    description: "CitiesSkyMine 統合コマンド"
    usage: "/csm <help|version|info|reload|road|intersection|facade|payload|load|load64|window|slabstairs|stack|selection|config|debugstick|preset>"
  rc:
    description: "道路カーブを生成するコマンド"
    usage: "/rc <help|set|build|reset|status|debugline|smoothline|version>"
  ".rc":
    description: "道路カーブを生成するショートカット"
    usage: "/.rc <help|set|build|reset|status|debugline|smoothline|version>"
  ri:
    description: "交差点を自動生成するコマンド"
    usage: "/ri <here|set|build|status|help>"
  ".ri":
    description: "交差点を自動生成するショートカット"
    usage: "/.ri <here|set|build|status|help>"
  hb:
    description: "オスマン様式ファサードを生成するコマンド"
    usage: "/hb <build|schem|help> [options]"
  ".hb":
    description: "オスマン様式ファサードを生成するショートカット"
    usage: "/.hb <build|schem|help> [options]"
  ".pl":
    description: "CitiesSkyMine payload 配置ショートカット"
    usage: "/.pl <load|load64> <payload> [0-3] [L|R]"
  ".win":
    description: "窓生成ショートカット"
    usage: "/.win [width] [height] [frame] [glass] [backing]"
  ".ss":
    description: "SlabStairs 生成ショートカット"
    usage: "/.ss [build] [slab] [stair] [full]"
  ".ns":
    description: "選択範囲をプレイヤー視点基準で複製するショートカット"
    usage: "/.ns <forward|back|left|right|up|down...> <times> [skip-blocks...]"
  ".sel":
    description: "WorldEdit 選択範囲の保存・復元ショートカット"
    usage: "/.sel <save|list|delete|p|name>"
  ".cf":
    description: "CitiesSkyMine 個人設定GUI"
    usage: "/.cf"
  ".ds":
    description: "debug-stick 互換ショートカット"
    usage: "/.ds <select|cycle>"
  ".brp":
    description: "ブラシプリセットショートカット"
    usage: "/.brp <save|load|list|delete|名前>"
  ".csmenu":
    description: "CsmMenu — CitiesSkyMine 独自メニューエンジン (OyasaiMenu フォーク)"
    usage: "/.csmenu <menu-id|reload>"
  ".gm":
    description: "ChestGUI メーカー (OP限定)"
    usage: "/.gm <new <id>|edit <id> [canvas|preview|commit|revert|info|title|name|lore|perm|action|clearslot]|list>"
    permission: citiesskymine.guimaker
    permission-message: "このコマンドはOPのみ使用できます。"

permissions:
  citiesskymine.*:
    description: "CitiesSkyMine の全権限"
    default: op
    children:
      citiesskymine.role.admin: true
      citiesskymine.role.takumi: true
      citiesskymine.role.builder: true
      citiesskymine.use: true
      citiesskymine.admin: true
      citiesskymine.road: true
      citiesskymine.build: true
      citiesskymine.payload: true
      citiesskymine.window: true
      citiesskymine.slabstairs: true
      citiesskymine.stack: true
      citiesskymine.selection: true
      citiesskymine.config: true
      citiesskymine.debugstick: true
      citiesskymine.preset: true
      citiesskymine.guimaker: true
  citiesskymine.role.admin:
    description: "CSM アドミンロール"
    default: op
  citiesskymine.role.takumi:
    description: "CSM たくみロール"
    default: false
  citiesskymine.role.builder:
    description: "CSM 建築士ロール"
    default: false
  citiesskymine.use:
    description: "旧形式: CitiesSkyMine 統合コマンドの使用権限"
    default: false
  citiesskymine.admin:
    description: "旧形式: CitiesSkyMine 管理コマンドの使用権限"
    default: false
  citiesskymine.road:
    description: "旧形式: 道路生成コマンドの使用権限"
    default: false
  citiesskymine.build:
    description: "旧形式: 建築生成コマンドの使用権限"
    default: false
  citiesskymine.payload:
    description: "旧形式: payload 配置コマンドの使用権限"
    default: false
  citiesskymine.window:
    description: "旧形式: 窓生成コマンドの使用権限"
    default: false
  citiesskymine.slabstairs:
    description: "旧形式: SlabStairs 生成コマンドの使用権限"
    default: false
  citiesskymine.stack:
    description: "旧形式: 選択範囲複製コマンドの使用権限"
    default: false
  citiesskymine.selection:
    description: "旧形式: WorldEdit 選択範囲保存コマンドの使用権限"
    default: false
  citiesskymine.config:
    description: "旧形式: 個人設定GUIの使用権限"
    default: false
  citiesskymine.debugstick:
    description: "旧形式: debug-stick 互換コマンドの使用権限"
    default: false
  citiesskymine.preset:
    description: "旧形式: ブラシプリセットコマンドの使用権限"
    default: false
  citiesskymine.guimaker:
    description: "GuiMaker OP限定コマンドの使用権限"
    default: op
