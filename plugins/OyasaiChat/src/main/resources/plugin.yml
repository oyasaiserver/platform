name: OyasaiChat
version: "0.1.0-SNAPSHOT"
main: io.oyasai.chat.paper.OyasaiChatPlugin
api-version: "1.21.11"
description: バックエンド間チャット同期
author: takucan
softdepend:
  - Vault
  - LuckPerms
  - DiscordSRV
commands:
  mute:
    description: Toggle or update a player mute
    usage: /mute <player> [duration] [reason]
    permission: essentials.mute
  ch:
    description: Select a chat channel
    usage: /ch <channel>
    aliases: [channel]
  join:
    description: Join and select a chat channel
    usage: /join <channel>
  leave:
    description: Leave a chat channel
    usage: /leave <channel>
  chwho:
    description: List channel members on this backend
    usage: /chwho <channel>
  chlist:
    description: List available chat channels
    usage: /chlist
  setchannel:
    description: Set another player's active channel
    usage: /setchannel <player> <channel>
    permission: oyasaichat.admin.setchannel
  msg:
    description: Send a private message
    usage: /msg <player> <message>
    aliases: [tell, message, pm]
  lang:
    description: Select your speech language or check one message
    usage: /lang [auto|off|language-name|check <id>]
    permission: oyasaichat.lang
  japanize:
    description: Toggle Japanese chat conversion or manage its dictionary
    usage: /japanize [on|off] or /japanize dict <add|remove|list|lookup>
    aliases: [jp]
  r:
    description: Reply to the last private message
    usage: /r <message>
    aliases: [reply]
  oyasaichat:
    description: OyasaiChat administrative commands
    usage: /oyasaichat reload
permissions:
  oyasaichat.lang:
    description: Select speech language and check messages
    default: true
  oyasaichat.japanize.dictionary:
    description: Manage Japanese conversion dictionary entries
    default: op
  essentials.mute:
    default: op
  essentials.mute.offline:
    default: op
  essentials.mute.exempt:
    default: false
  essentials.mute.unlimited:
    default: op
  essentials.mute.notify:
    default: op
  oyasaichat.links.send:
    description: Post links in chat as clickable URLs
    default: true
  oyasaichat.admin.setchannel:
    description: Change another player's active channel
    default: op
  oyasaichat.admin.import:
    description: Import staged LunaChat player preferences and dictionary
    default: op
  oyasaichat.admin.reload:
    description: Reload OyasaiChat configuration and player state
    default: op
