network:
  backend-id: main
  # 別バックエンドのメッセージ前後に付けるMiniMessage形式の識別子。
  # 空欄で識別子なし。
  remote-message-prefix: ""
  remote-message-suffix: ""
  groups:
    gameplay:
      - main
      - axiom
    all:
      - main
      - axiom
      - lobby

channels:
  global:
    display-name: Global
    # aliasesもスラッシュコマンドとして登録。/gで参加・選択、/g <message>で一度だけ送信。
    aliases: [g]
    # aliases以外に追加する任意のスラッシュコマンド。
    shortcut-commands: []
    prefix: Global
    auto-join: true
    default: true
    permission: null
    network-group: gameplay
  "2":
    display-name: "2"
    aliases: []
    shortcut-commands: []
    prefix: "2"
    auto-join: false
    default: false
    permission: null
    network-group: null
  "3":
    display-name: "3"
    aliases: []
    shortcut-commands: []
    prefix: "3"
    auto-join: false
    default: false
    permission: null
    network-group: null
  staff:
    display-name: Staff
    aliases: []
    shortcut-commands: []
    prefix: Staff
    auto-join: false
    default: false
    permission: venturechat.staffchannel
    network-group: null

formatting:
  # <name>/<displayname> はプレイヤーの装飾済み表示名。$name は装飾なしのアカウント名。
  # run_commandのコマンドに空白がある場合は、<click:run_command:'/command $name'> のように値をクォートする。
  # フォーマット内で<name>/<displayname>を<click:...>...</click>で囲んだ場合は、player-name-click-commandよりそちらを優先する。
  chat: "<dark_gray>[<channel>]</dark_gray> <vault_prefix><name><vault_suffix><dark_gray>: </dark_gray><message>"
  private-message-chat: "<gray>[<light_purple>PM</light_purple>]</gray> <white><sender></white> <dark_gray>-></dark_gray> <white><target></white><dark_gray>: </dark_gray><message>"
  # Discordなどの外部発メッセージのフォーマット。
  # <channel>/<name>/<username>/<displayname>/<displayname_colored>/<user_id>/<message>が使用可能。
  # <displayname_colored>は最上位の色付きロールで装飾した表示名(色付きロールが無ければ色設定なし)。
  external-chat: "<dark_purple>💬</dark_purple> <white><displayname_colored></white><dark_gray>: </dark_gray><message>"
  player-name-hover: "<gray>Player: <white><name>"
  player-name-click-command: "/msg <name> "

private-messages:
  enabled-by-default: true
  receive-sound:
    enabled: true
    sound: "minecraft:entity.experience_orb.pickup"
    volume: 1.0
    pitch: 1.0

discord:
  enabled: true
  # DiscordSRVのChannels設定で、上記channelsのdisplay-nameとDiscordチャンネルIDを対応付ける。
  # 例: Channels: {"Global": "1234567890", "2": "2345678901", "Staff": "3456789012"}

links:
  domain-filter: true
  allowed-domains:
    - media.discordapp.net
    - cdn.discordapp.com

# 同じJarをVelocity側に配置した場合、Velocity側のエントリポイントだけが読み込む設定。
# 上記バックエンドIDはルーティング用。表示名ではない。
login-messages:
  backend-display-names:
    main: "Main"
    axiom: "Axiom"
    lobby: "Lobby"
  from-suffix-format: " <gray>from <white><backend></white></gray>"
  to-suffix-format: " <gray>to <white><backend></white></gray>"
