name: ImageOnMap
main: icu.oyasai.imageonmap.ImageOnMap
version: ${version}
api-version: "1.21"
commands:
  tomap:
    usage: /tomap <URL> [resize [幅 高さ]]
  maptool:
    usage: /maptool new <URL> [resize [幅 高さ]]
  maps:
    usage: /maps
  givemap:
    usage: /givemap <プレイヤー> <画像ID>
permissions:
  imageonmap.*:
    default: true
    children:
      imageonmap.new: true
      imageonmap.list: true
      imageonmap.get: true
      imageonmap.give: false
      imageonmap.bypasssize: false
      imageonmap.placesplattermap: true
      imageonmap.removesplattermap: true
  imageonmap.new:
    default: true
  imageonmap.list:
    default: true
  imageonmap.get:
    default: true
  imageonmap.give:
    default: op
  imageonmap.bypasssize:
    default: op
  imageonmap.placesplattermap:
    default: true
  imageonmap.removesplattermap:
    default: true
