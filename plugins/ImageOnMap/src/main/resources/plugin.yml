name: ImageOnMap
main: icu.oyasai.imageonmap.ImageOnMap
version: ${version}
api-version: "1.21"
softdepend: [Gakubuchi-Locker]
commands:
  tomap:
    usage: /tomap
permissions:
  imageonmap.*:
    default: true
    children:
      imageonmap.new: true
      imageonmap.list: true
      imageonmap.get: true
      imageonmap.give: false
      imageonmap.bypasssize: false
      imageonmap.listother: false
      imageonmap.getother: false
      imageonmap.deleteother: false
      imageonmap.placesplattermap: true
      imageonmap.removesplattermap: true
  imageonmap.new:
    default: true
  imageonmap.list:
    default: true
  imageonmap.get:
    default: true
  imageonmap.give:
    default: op
  imageonmap.bypasssize:
    default: op
  imageonmap.listother:
    default: op
  imageonmap.getother:
    default: op
  imageonmap.deleteother:
    default: op
  imageonmap.placesplattermap:
    default: true
  imageonmap.removesplattermap:
    default: true
