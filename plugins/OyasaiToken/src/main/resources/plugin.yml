name: TokenManager
main: io.oyasai.oyasaitoken.OyasaiTokenPlugin
version: "0.1.0"
api-version: "1.21.11"
author: OyasaiServer
description: SQLite-backed Oyasai token manager with TokenManager compatibility.
softdepend: [TAB]
commands:
  token:
    description: Token command
    usage: /token [balance [player]|send <player> <amount>|top [n]|add|remove|set <player> <amount>|reload]
permissions:
  token.use:
    description: Allows personal balance, send, and top commands
    default: true
  token.admin:
    description: Allows token administration commands
    default: op
  tokenmanager.admin:
    description: Legacy alias for token.admin
    default: op
    children:
      token.admin: true
  tokenmanager.use:
    description: Legacy alias for token.use
    default: true
    children:
      token.use: true
  tokenmanager.use.send:
    description: Legacy alias for token.use
    default: true
    children:
      token.use: true
