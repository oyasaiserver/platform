name: HeadHunt
version: '${version}'
main: com.ququla89.headhunt.HeadHuntPlugin
api-version: '1.21'
author: QuQuLa89
description: Head-block treasure hunting minigame (solo / team)

permissions:
  headhunt.admin:
    description: Allows administrative HeadHunt commands (setmode, start, reset, stop, deleteall, team management, list)
    default: op
  headhunt.use:
    description: Allows basic HeadHunt commands (team list, team info)
    default: true
