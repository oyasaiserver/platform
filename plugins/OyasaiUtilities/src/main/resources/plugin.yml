name: OyasaiUtilities
description: "おやさい鯖の小物Plugins"
authors: [Srain3, takucan]
website: "https://github.com/OyasaiServer"
main: icu.oyasai.utilities.Main
api-version: "1.21"
version: "0.1.0"
softdepend: [Veinminer]
commands:
  orerepopreload:
    description: "OreReappearsのconfigリロードコマンド"
  orerepopswitch:
    description: "OreReappearsの機能On/Off切り替え"
  adminbp:
    description: "AdminBPのコマンド"
    aliases: [abp]
  oresmelter:
    description: "OreSmelterのコマンド"
    aliases: [os]
  uuid:
    description: "UUIDを容易にコピーするコマンド"
  timerbar:
    description: "TimerBarのコマンド"
    permission: oyasaiutilities.timerbar
  back:
    description: "前回TPした場所に戻る"
    aliases: [bk]
  forward:
    description: "これ以降にTPした場所に戻る"
    aliases: [fow, fw]
  tpdata:
    description: "全てのプレイヤーのTP履歴を表示"
    permission: oyasaiutilities.tpdata
  pita:
    description: "ピタッ！と止まるモードの切り替え"
  debugonbe:
    description: DebugOnBE メインコマンド
    usage: /debugonbe <refresh|reload|help>
    aliases: [dobe, dob]
  togo:
    description: Togo (DebugOnBE Refresh) コマンド
    usage: /togo [radius] [time]
    aliases: [refreshtogo, "-"]
  togom:
    description: Togo Mode (DebugOnBE 設定GUI) コマンド
    usage: /togom [types/reset/lim/radius/duration]

permissions:
  oyasaiutilities.timerbar:
    description: "TimerBarコマンドの使用権限"
  oyasaiutilities.tpdata:
    default: op
  cm.bypass:
    description: "CreativeManagementのバイパスする権限"
    default: op
  cm.bypass.spawn_egg:
    description: "CreativeManagementのSpawnEggバイパスする権限"
    default: op
  debugonbe.admin:
    description: DebugOnBE の管理権限
    default: op
  debugonbe.refresh:
    description: Togo (DebugOnBE Refresh) コマンドの使用権限
    default: true
