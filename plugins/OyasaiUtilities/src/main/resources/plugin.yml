name: OyasaiUtilities
description: "おやさい鯖の小物Plugins"
authors: [Srain3, takucan]
website: "https://github.com/OyasaiServer"
main: icu.oyasai.utilities.Main
api-version: "1.21"
version: "0.1.0"
softdepend: [Vault, TokenManager, LuckPerms, floodgate, Essentials]
commands:
  gamemode:
    usage: /<command>
    permission: essentials.gamemode
    permission-message: "§cこのコマンドを使用する権限がありません。"
    aliases: [gm, gmc, gms, gmsp, gma, sp, spec, spectator, survival, creative]
  fly:
    usage: /<command>
    permission: essentials.fly
    permission-message: "§cこのコマンドを使用する権限がありません。"
  speed:
    usage: /<command>
    permission: essentials.speed
    permission-message: "§cこのコマンドを使用する権限がありません。"
    aliases: [flyspeed]
  jump:
    usage: /<command>
    permission: essentials.jump
    permission-message: "§cこのコマンドを使用する権限がありません。"
    aliases: [j, jumpto]
  time:
    usage: /<command>
    permission: essentials.time
    permission-message: "§cこのコマンドを使用する権限がありません。"
    aliases: [day, night]
  weather:
    usage: /<command>
    permission: essentials.weather
    permission-message: "§cこのコマンドを使用する権限がありません。"
    aliases: [sun, rain]
  ptime:
    usage: /<command>
    permission: essentials.ptime
    permission-message: "§cこのコマンドを使用する権限がありません。"
    aliases: [playertime]
  heal:
    usage: /<command>
    permission: essentials.heal
    permission-message: "§cこのコマンドを使用する権限がありません。"
  afk:
    usage: /<command>
    permission: essentials.afk
    permission-message: "§cこのコマンドを使用する権限がありません。"
  nick:
    usage: /<command>
    permission: essentials.nick
    permission-message: "§cこのコマンドを使用する権限がありません。"
  realname:
    usage: /<command>
    permission: essentials.realname
    permission-message: "§cこのコマンドを使用する権限がありません。"
  workbench:
    usage: /<command>
    permission: essentials.workbench
    permission-message: "§cこのコマンドを使用する権限がありません。"
    aliases: [craft, wb]
  enderchest:
    usage: /<command> [player]
    permission: essentials.enderchest
    permission-message: "§cこのコマンドを使用する権限がありません。"
    aliases: [ec]
  disposal:
    usage: /<command>
    permission: essentials.disposal
    permission-message: "§cこのコマンドを使用する権限がありません。"
    aliases: [trash]
  anvil:
    usage: /<command>
    permission: essentials.anvil
    permission-message: "§cこのコマンドを使用する権限がありません。"
  loom:
    usage: /<command>
    permission: essentials.loom
    permission-message: "§cこのコマンドを使用する権限がありません。"
  grindstone:
    usage: /<command>
    permission: essentials.grindstone
    permission-message: "§cこのコマンドを使用する権限がありません。"
  stonecutter:
    usage: /<command>
    permission: essentials.stonecutter
    permission-message: "§cこのコマンドを使用する権限がありません。"
  smithingtable:
    usage: /<command>
    permission: essentials.smithingtable
    permission-message: "§cこのコマンドを使用する権限がありません。"
  hat:
    usage: /<command> [remove]
    permission: essentials.hat
    permission-message: "§cこのコマンドを使用する権限がありません。"
    aliases: [head]
  skull:
    usage: /<command> [owner] [player]
    permission: essentials.skull
    permission-message: "§cこのコマンドを使用する権限がありません。"
    aliases: [eskull, playerskull]
  annaimode:
    usage: /annaimode [<player>]
  guidecheck:
    usage: /guidecheck <player>
    permission: group.jokyu
  annai:
    usage: /annai [<text>]
    permission: server.annai.use
    permission-message: "§cこのコマンドを使用する権限がありません。"
  annai-en:
    usage: /annai-en [<text>]
    permission: server.annai.use
    permission-message: "§cこのコマンドを使用する権限がありません。"
  anshi:
    usage: /anshi
    permission: oyasai.night_vision
    permission-message: "§cこのコマンドを使う権限がありません"
  sokudo:
    usage: /sokudo <number>
    permission: oyasai.flyspeed
    permission-message: "§cこのコマンドを使う権限がありません"
  reach:
    usage: /reach [<text>]
    permission: reach.use
    permission-message: "§cこのコマンドを使用する権限がありません。"
  getdebugstick:
    usage: /getdebugstick
  scale:
    usage: /scale [<text>] [<text>]
  c:
    usage: /c
  d:
    usage: /d
  l:
    usage: /l
  savedyeitem:
    usage: /savedyeitem
    permission: save.dye.item
  savemenuitem:
    usage: /savemenuitem
    permission: save.menu.item
  getdye:
    usage: /getdye
  getmenu:
    usage: /getmenu
  tpset:
    description: "Teleport setting."
    usage: "/<command> [option]"
    permission: tpswitch.tpset
    permission-message: "§4No permission!!!"
  sit:
    description: "座る・右クリック座りとPlayerSitモードを切り替える"
    usage: "/<command> [toggle|playermode [rank|all]]"
    aliases: [gsit]
  lay:
    description: "仰向けに寝そべる"
    aliases: [glay, layback, glayback]
  bellyflop:
    description: "うつ伏せになる"
    aliases: [gbellyflop]
  spin:
    description: "回転する"
    aliases: [gspin]
  crawl:
    description: "這う"
    aliases: [gcrawl]
  skin:
    description: "自分のスキンを変更する"
    usage: /skin <set <MCID>|reset>
    permission: oyasai.skin
  redbull:
    description: "20ポイントで一日 fly 権限を有効にする"
    permission: redbull.use
  buyredbull:
    description: "Red Bull を購入する"
    permission: redbull.give
  buyredbullset:
    description: "Red Bull 12本セットを購入する"
    permission: redbull.give
  orerepopreload:
    description: "OreReappearsのconfigリロードコマンド"
  orerepopswitch:
    description: "OreReappearsの機能On/Off切り替え"
  adminbp:
    description: "AdminBPのコマンド"
    aliases: [abp]
  oyasaibackpack:
    description: "個人バックパックを開く"
    aliases: [obp]
    permission: backpack.use
  oresmelter:
    description: "OreSmelterのコマンド"
    aliases: [os]
  uuid:
    description: "UUIDを容易にコピーするコマンド"
  timerbar:
    description: "TimerBarのコマンド"
    permission: oyasaiutilities.timerbar
  back:
    description: "前回TPした場所に戻る"
    aliases: [bk]
  forward:
    description: "これ以降にTPした場所に戻る"
    aliases: [fow, fw]
  tpdata:
    description: "全てのプレイヤーのTP履歴を表示"
    permission: oyasaiutilities.tpdata
  pita:
    description: "ピタッ！と止まるモードの切り替え"
  h:
    description: "パーティクル帽子のメニューを開く"
    aliases: [particlehats]
    permission: oyasai.hats.use
  debugonbe:
    description: DebugOnBE メインコマンド
    usage: /debugonbe <refresh|reload|help>
    aliases: [dobe, dob]
  togo:
    description: Togo (DebugOnBE Refresh) コマンド
    usage: /togo [radius] [time]
    aliases: [refreshtogo, "-"]
  togom:
    description: Togo Mode (DebugOnBE 設定GUI) コマンド
    usage: /togom [types/reset/lim/radius/duration/replace]
  oholo:
    description: "ホログラム"
    usage: /oholo <create|delete|list|near|movehere|line|import|range|seethrough|background|tool|menu|angle>
    permission: oyasaiutilities.hologram
  spawn:
    description: "スポーン地点へテレポートする"
    usage: /spawn [player]
    permission: oyasaiutilities.spawn

