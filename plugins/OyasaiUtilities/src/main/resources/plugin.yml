name: OyasaiUtilities
description: "おやさい鯖の小物Plugins"
authors: [Srain3, takucan]
website: "https://github.com/OyasaiServer"
main: icu.oyasai.utilities.Main
api-version: "1.21"
version: "0.1.0"
softdepend: [Vault, TokenManager, LuckPerms, floodgate, Minepacks]
commands:
  skin:
    description: "自分のスキンを変更する"
    usage: /skin <set <MCID>|reset>
    permission: oyasai.skin
  redbull:
    description: "20ポイントで一日 fly 権限を有効にする"
    permission: redbull.use
  buyredbull:
    description: "Red Bull を購入する"
    permission: redbull.give
  buyredbullset:
    description: "Red Bull 12本セットを購入する"
    permission: redbull.give
  orerepopreload:
    description: "OreReappearsのconfigリロードコマンド"
  orerepopswitch:
    description: "OreReappearsの機能On/Off切り替え"
  adminbp:
    description: "AdminBPのコマンド"
    aliases: [abp]
  oyasaibackpack:
    description: "個人バックパックを開く / Minepacks データを移行する"
    usage: /oyasaibackpack [migrate-minepacks [confirm]]
    aliases: [obp]
    permission: backpack.use
  oresmelter:
    description: "OreSmelterのコマンド"
    aliases: [os]
  uuid:
    description: "UUIDを容易にコピーするコマンド"
  timerbar:
    description: "TimerBarのコマンド"
    permission: oyasaiutilities.timerbar
  back:
    description: "前回TPした場所に戻る"
    aliases: [bk]
  forward:
    description: "これ以降にTPした場所に戻る"
    aliases: [fow, fw]
  tpdata:
    description: "全てのプレイヤーのTP履歴を表示"
    permission: oyasaiutilities.tpdata
  pita:
    description: "ピタッ！と止まるモードの切り替え"
  h:
    description: "パーティクル帽子のメニューを開く"
    aliases: [particlehats]
    permission: oyasai.hats.use
  debugonbe:
    description: DebugOnBE メインコマンド
    usage: /debugonbe <refresh|reload|help>
    aliases: [dobe, dob]
  togo:
    description: Togo (DebugOnBE Refresh) コマンド
    usage: /togo [radius] [time]
    aliases: [refreshtogo, "-"]
  togom:
    description: Togo Mode (DebugOnBE 設定GUI) コマンド
    usage: /togom [types/reset/lim/radius/duration/replace]
  oholo:
    description: "ホログラム"
    usage: /oholo <create|delete|list|near|movehere|line|import>
    permission: oyasaiutilities.hologram

permissions:
  oyasai.skin:
    description: "スキン変更コマンドの使用権限"
    default: op
  redbull.use:
    description: "Red Bull の一日 fly 権限を有効にする"
    default: true
  redbull.give:
    description: "Red Bull を購入・付与する"
    default: op
  oyasaiutilities.timerbar:
    description: "TimerBarコマンドの使用権限"
  oyasaiutilities.tpdata:
    default: op
  oyasaiutilities.hologram:
    description: "ホログラムコマンド"
    default: op
  backpack.user:
    description: "標準サイズのバックパックを使う"
    default: false
    children:
      backpack.use: true
      backpack.size.1: true
  backpack.userBig:
    description: "最大サイズのバックパックを使う"
    default: false
    children:
      backpack.use: true
      backpack.size.6: true
  backpack.use:
    description: "自分のバックパックを開く"
    default: false
  backpack.size.1:
    description: "1段のバックパックを使う"
    default: false
  backpack.size.2:
    description: "2段のバックパックを使う"
    default: false
  backpack.size.3:
    description: "3段のバックパックを使う"
    default: false
  backpack.size.4:
    description: "4段のバックパックを使う"
    default: false
  backpack.size.5:
    description: "5段のバックパックを使う"
    default: false
  backpack.size.6:
    description: "6段のバックパックを使う"
    default: false
  cm.bypass:
    description: "CreativeManagementのバイパスする権限"
    default: op
  cm.bypass.spawn_egg:
    description: "CreativeManagementのSpawnEggバイパスする権限"
    default: op
  debugonbe.admin:
    description: DebugOnBE の管理権限
    default: op
  debugonbe.refresh:
    description: Togo (DebugOnBE Refresh) コマンドの使用権限
    default: true
  oyasai.hats.use:
    description: /h でパーティクル帽子メニューを開く
    default: true
    children:
      particlehats.command.h: true
  oyasai.hats.donator:
    description: すべてのパーティクル帽子を装備する（寄付者）
    default: false
    children:
      oyasai.hats.halo: true
      oyasai.hats.cape: true
      oyasai.hats.plumbob: true
      oyasai.hats.creeper: true
      oyasai.hats.angel_wings: true
      oyasai.hats.rainbow: true
      oyasai.hats.thief: true
      oyasai.hats.rocket: true
      oyasai.hats.magic_aura: true
      oyasai.hats.notes: true
      oyasai.hats.tornado: true
      oyasai.hats.witches_sphere: true
      oyasai.hats.bubble_wings: true
      particlehats.particle.all: true
  oyasai.hats.halo:
    description: Colourful Redstone Halo を装備する
    default: false
  oyasai.hats.cape:
    description: Sparkling Cape を装備する
    default: false
  oyasai.hats.plumbob:
    description: Plumbob を装備する
    default: false
  oyasai.hats.creeper:
    description: Creeper Face を装備する
    default: false
  oyasai.hats.angel_wings:
    description: Angel Wings を装備する
    default: false
  oyasai.hats.rainbow:
    description: rainbow アーチを装備する
    default: false
  oyasai.hats.thief:
    description: Thief! トレイルを装備する
    default: false
  oyasai.hats.rocket:
    description: Rocket Trail を装備する
    default: false
  oyasai.hats.magic_aura:
    description: Magic Aura を装備する
    default: false
  oyasai.hats.notes:
    description: Notes を装備する
    default: false
  oyasai.hats.tornado:
    description: Tornado を装備する
    default: false
  oyasai.hats.witches_sphere:
    description: Witches Sphere を装備する
    default: false
  oyasai.hats.bubble_wings:
    description: Bubble Wings を装備する
    default: false
  particlehats.command.h:
    description: 旧 ParticleHats 互換。/h を開く
    default: true
  particlehats.particle.all:
    description: 旧 ParticleHats 互換。すべての帽子を装備する
    default: false
    children:
      particlehats.particle.halo: true
      particlehats.particle.cape: true
      particlehats.particle.plumbob: true
      particlehats.particle.creeper: true
      particlehats.particle.angel_wings: true
      particlehats.particle.rainbow: true
      particlehats.particle.thief: true
      particlehats.particle.rocket: true
      particlehats.particle.magic_aura: true
      particlehats.particle.notes: true
      particlehats.particle.tornado: true
      particlehats.particle.witches_sphere: true
      particlehats.particle.bubble_wings: true
  particlehats.particle.halo:
    default: false
  particlehats.particle.cape:
    default: false
  particlehats.particle.plumbob:
    default: false
  particlehats.particle.creeper:
    default: false
  particlehats.particle.angel_wings:
    default: false
  particlehats.particle.rainbow:
    default: false
  particlehats.particle.thief:
    default: false
  particlehats.particle.rocket:
    default: false
  particlehats.particle.magic_aura:
    default: false
  particlehats.particle.notes:
    default: false
  particlehats.particle.tornado:
    default: false
  particlehats.particle.witches_sphere:
    default: false
  particlehats.particle.bubble_wings:
    default: false
