    baseSpeed: 0.6
    maxSpeed: 1.2
    jumpPower: 0.6
    scaleMin: 1.5
    scaleMax: 2.5
  cat:
    baseSpeed: 0.5
    maxSpeed: 1.0
    jumpPower: 0.9
    scaleMin: 2.2
    scaleMax: 3.4
  chicken:
    baseSpeed: 0.4
    maxSpeed: 0.9
    jumpPower: 0.5
    scaleMin: 1.5
    scaleMax: 2.5
  dolphin:
    baseSpeed: 0.5
    maxSpeed: 1.0
    jumpPower: 0.5
    scaleMin: 1.2
    scaleMax: 2.2
  parrot:
    baseSpeed: 0.5
    maxSpeed: 1.0
    jumpPower: 0.5
    scaleMin: 1.5
    scaleMax: 3.5
  fox:
    baseSpeed: 0.7
    maxSpeed: 1.3
    jumpPower: 0.7
    scaleMin: 1.5
    scaleMax: 2.5
  frog:
    baseSpeed: 0.5
    maxSpeed: 1.0
    jumpPower: 1.2
    scaleMin: 2.0
    scaleMax: 3.0
  allay:
    baseSpeed: 0.6
    maxSpeed: 1.2
    jumpPower: 0.5
    scaleMin: 1.0
    scaleMax: 2.0
  axolotl:
    baseSpeed: 0.5
    maxSpeed: 1.0
    jumpPower: 0.5
    scaleMin: 1.5
    scaleMax: 2.5
  bee:
    baseSpeed: 0.6
    maxSpeed: 1.1
    jumpPower: 0.5
    scaleMin: 1.0
    scaleMax: 2.0
  rabbit:
    baseSpeed: 0.6
    maxSpeed: 1.2
    jumpPower: 0.8
    scaleMin: 1.5
    scaleMax: 2.5
  panda:
    baseSpeed: 0.4
    maxSpeed: 0.8
    jumpPower: 0.5
    scaleMin: 2.0
    scaleMax: 3.0
  polar_bear:
    baseSpeed: 0.5
    maxSpeed: 1.0
    jumpPower: 0.6
    scaleMin: 2.5
    scaleMax: 3.5
  pufferfish:
    baseSpeed: 0.4
    maxSpeed: 0.8
    jumpPower: 0.5
    scaleMin: 1.0
    scaleMax: 2.0
  turtle:
    baseSpeed: 0.3
    maxSpeed: 0.7
    jumpPower: 0.5
    scaleMin: 1.5
