# ショップ設定
shop:
  defaultCost: 100       # デフォルト購入価格

# スキルブック設定
skillbook:
  costLv1: 100           # スキルブックLv.1コスト
  costLv2: 150           # スキルブックLv.2コスト
  costLv3: 200           # スキルブックLv.3コスト

# ペット復活設定
revive:
  cost: 20               # 死亡したペットを復活させるコスト

# スポーンエッグ再取得設定
recover:
  cost: 20               # 紛失したスポーンエッグを再取得するコスト

# 交配システム設定
breed:
  minLevel: 10           # 交配可能になる最低レベル

  # === 能力値遺伝の詳細パラメータ ===

  # ランダム要素の範囲
  randomMin: 0.95        # ランダム係数の最小値（95%）
  randomMax: 1.1         # ランダム係数の最大値（110%）
                         # → 親の平均能力に対して 95%〜110% のランダム性

  # 突然変異
  mutationChance: 0.05   # 突然変異が発生する確率（5% = 0.05）
  mutationBoost: 1.1     # 突然変異時の能力ブースト倍率（1.1倍 = 110%）

  # 世代ボーナス
  genBonusPerGen: 0.01   # 1世代ごとに追加されるボーナス（1% = 0.01）
  genBonusMax: 0.2       # 世代ボーナスの上限（20% = 0.2）
                         # 例: 第1世代 = +1%, 第2世代 = +2%, ... 第20世代以上 = +20%

  # 能力値の上限
  statCap: 1.5           # 速度とジャンプ力の最大倍率（1.5 = 150%）

  # 初期レベルボーナス
  bonusLevelPerGen: 1    # 1世代ごとに獲得する初期レベル（1世代 = +1Lv）
  bonusLevelMax: 10      # 初期レベルボーナスの上限（最大10レベル）
                         # 例: 第2世代 = Lv.1スタート, 第11世代以上 = Lv.10スタート

# 遊びでレベルアップ設定
play:
  levelUpChance: 0.05    # おもちゃ・ブラシでレベルアップする確率（5%）
  levelUpMaxLevel: 10    # 遊びでレベルアップできる最大レベル

# ==========================================
# 設定カスタマイズ例
# ==========================================

# 【例1】より強力なペットを作りやすくする
# breed:
#   randomMin: 0.98
#   randomMax: 1.15
#   mutationChance: 0.10
#   mutationBoost: 1.2
#   genBonusPerGen: 0.02
#   genBonusMax: 0.30
#   statCap: 2.0
#   bonusLevelPerGen: 2
#   bonusLevelMax: 20

# 【例2】ハードモード（育成難易度を上げる）
# breed:
#   randomMin: 0.90
#   randomMax: 1.10
#   mutationChance: 0.02
#   mutationBoost: 1.05
#   genBonusPerGen: 0.005
#   genBonusMax: 0.10
#   statCap: 1.3
#   bonusLevelPerGen: 0
#   bonusLevelMax: 0

# 【例3】価格を調整
# shop:
#   defaultCost: 200
# economy:
#   foodPointCost: 5
# revive:
#   cost: 50
# recover:
#   cost: 50

