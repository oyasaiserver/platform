# ==========================================
# 3. 遊び設定
# ==========================================

play:
  levelUpChance: 0.05 # おもちゃ・ブラシでレベルアップする確率（5%）
  levelUpMaxLevel: 10 # 遊びでレベルアップできる最大レベル

# ==========================================
# 4. 交配設定
# ==========================================

breed:
  minLevel: 10 # 交配可能になる最低レベル
  cost: 100 # 交配コスト
  maxCount: 3 # 1ペアから生まれる最大子供数

  # --- 能力値遺伝パラメータ ---
  randomMin: 0.9 # ランダム係数の最小値（90%）
  randomMax: 1.1 # ランダム係数の最大値（110%）
  mutationChance: 0.10 # 突然変異が発生する確率（10%）
  mutationBoost: 0.15 # 突然変異時の能力ブースト量（+15%）
  genBonusPerGen: 0.02 # 1世代ごとに追加されるボーナス（+2%）
  genBonusMax: 0.2 # 世代ボーナスの上限（+20%）
  statCap: 1.5 # 速度・ジャンプ力の最大倍率（150%）
  bonusLevelPerGen: 1 # 1世代ごとに獲得する初期レベル
  bonusLevelMax: 5 # 初期レベルボーナスの上限（最大 +5Lv）

  # --- バリアント遺伝確率 ---
  # 親バリアントの重み(parent) と その他の重み(other) で子のバリアントを決定する
  # 例: parent=7, other=3 の場合（オオカミ9種）
  #   親1: 7個, 親2: 7個, その他7種: 各3個 → 合計35個
  #   確率: 親1=20%, 親2=20%, その他各≈8.6%
  variantWeights:
    parent: 7 # 親バリアントの重み
    other: 3 # その他バリアントの重み

# ==========================================
# 5. 特殊形質（非定型）設定
# ==========================================

traits:
  atypicalBaseChance: 0.07 # 基本発生確率（7%）
  atypicalOneParentChance: 0.15 # 片親が非定型の場合の発生確率（15%）
  atypicalBothParentChance: 0.35 # 両親が非定型の場合の発生確率（35%）
  atypicalLevelUpBonus: 1.5 # 非定型ペットのレベルアップ確率倍率
  atypicalAffectionBonus: 1.3 # 非定型ペットの親密度上昇倍率
  childAiEnabled: true # 子供ペットの AI を有効にするか
