# ========================================
# OyasaiPets プラグイン設定ファイル
# ========================================

# 経済設定
economy:
  foodPointCost: 100

# ペット設定
pets:
  maxFoodLevel: 50
  freeRoamFlyingSpeedMultiplier: 0.5

# ショップ設定
shop:
  defaultCost: 100

# スキルブック設定
skillbook:
  costLv1: 50
  costLv2: 100
  costLv3: 150

# 復活設定
revive:
  cost: 50

# 回復アイテム設定
items:
  healAmount: 10

# 遊び機能設定
play:
  levelUpChance: 0.05
  levelUpMaxLevel: 10

# 交配設定
breed:
  minLevel: 10
  cost: 200
  maxCount: 3

  # バリアント遺伝確率設定
  # =====================================================
  # 交配時に子供のバリアントを決定する重み設定
  #
  # 計算方法:
  #   親1のバリアント: parent x 1個
  #   親2のバリアント: parent x 1個
  #   その他のバリアント: other x (全バリアント数 - 親のバリアント数)個
  #
  # 例: オオカミ（9種類）で parent=7, other=3 の場合
  #   親1: 7個
  #   親2: 7個
  #   その他7種: 各3個
  #   合計: 7 + 7 + (7x3) = 35個
  #   確率: 親1=20%, 親2=20%, その他各=8.6%
  #
  # 設定例:
  #   parent=10, other=0  : 親のバリアントのみ（100%遺伝）
  #   parent=7,  other=3  : デフォルト（親40%, その他60%）
  #   parent=5,  other=5  : 均等（親約22%, その他約78%）
  #   parent=3,  other=7  : その他優先（親約15%, その他約85%）
  #   parent=0,  other=10 : 完全ランダム（親のバリアントも均等扱い）
  # =====================================================
  variantWeights:
    parent: 7
    other: 3
