# ==========================================
# OyasaiPets 設定ファイル
# ==========================================

# ==========================================
# 1. コスト設定
# ==========================================

# 経済設定
economy:
  foodPointCost: 10 # ペット餌やりポイントのコスト

# ショップ設定
shop:
  defaultCost: 100 # スポーンエッグのデフォルト購入価格

# スキルブック設定
skillbook:
  # ショップ購入コスト
  shopCostLv1: 50 # スキルブック Lv.1 購入コスト
  shopCostLv2: 100 # スキルブック Lv.2 購入コスト
  shopCostLv3: 150 # スキルブック Lv.3 購入コスト
  # 使用時の消費コスト
  useCostLv1: 50 # スキルブック Lv.1 使用コスト
  useCostLv2: 100 # スキルブック Lv.2 使用コスト
  useCostLv3: 150 # スキルブック Lv.3 使用コスト
  # 旧キー costLv* も下位互換として読み込まれます（未指定時はshop/useに同じ値が入ります）

# ペット復活設定
revive:
  cost: 50 # 死亡したペットを復活させるコスト

# スポーンエッグ再取得設定
recover:
  cost: 50 # 紛失したスポーンエッグを再取得するコスト

# 回復アイテム設定
items:
  healAmount: 10 # 回復アイテムの回復量

# アイテムショップ価格設定
itemshop:
  petFoodCost: 20 # ペットフードの価格
  petBrushCost: 15 # ペットブラシの価格
  petTreatCost: 15 # ペットのおやつの価格
  healPotionCost: 30 # ヒールポーションの価格
  particleCost: 200 # パーティクル結晶の価格（1個）
  toyCost: 50 # おもちゃの価格（1個）

# ==========================================
# 2. ペット全般設定
# ==========================================

pets:
  maxFoodLevel: 50 # ペットの最大食事レベル
  spawnAiEnabled: true # ペットスポーン時に AI を有効にするか
  freeRoamSpeedMultiplier: 0.5 # フリーローム時の速度倍率（陸上・水中MOB）
  freeRoamFlyingSpeedMultiplier: 0.5 # フリーローム時の速度倍率（飛行MOB）

