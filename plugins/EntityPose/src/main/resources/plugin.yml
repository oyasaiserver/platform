name: EntityPose
version: '1.0-SNAPSHOT'
main: me.ankokunsan.entityPose.EntityPose
api-version: '1.21'

commands:
  entitystick:
    description: エンティティ棒をもらう
    usage: /entitystick
    permission: entitypose_arrange

  entityinfo:
    description: エンティティの諸元を表示
    usage: /entityinfo
    permission: entitypose_arrange

  kakudo:
    description: 角度変更
    usage: /kakudo
    permission: entitypose_arrange

  zahyo:
    description: 座標の動かす量変更
    usage: /zahyo
    permission: entitypose_arrange

permissions:
  entitypose_arrange:
    description: このプラグイン全体の権限
    default: op
