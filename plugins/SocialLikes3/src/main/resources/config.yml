# Data source used to initialize the in-memory SocialLikes build cache.
# YAML is safe by default. sqlite is honoured only after the startup ID migration records the
# completion marker; otherwise the plugin warns and continues from YAML.
readSource: yaml

# Whether to copy the plugin's dataFolder to SocialLikes3-backups/startup-<timestamp> on every enable.
backupOnStartup: true

# How many of the most recent startup-* backups to keep. Older ones are deleted after each
# successful backup. Set to a large number (or 0) to effectively disable pruning.
backupKeepCount: 5

# Interval in minutes for periodic dirty build reconciliation (SQLite retry).
reconcileIntervalMinutes: 10

# Negative build ID migration settings (one-shot migration from negative to positive IDs).
# Keep both false unless running the maintenance migration.
# Procedure: stop player access, set migrateNegativeIdsOnStartup: true, choose dry-run or
# execution with migrateNegativeIdsDryRun, start the server, confirm the backup and migration logs,
# stop the server, then set migrateNegativeIdsOnStartup back to false before the next restart.
migrateNegativeIdsOnStartup: false
migrateNegativeIdsDryRun: false

guidebook:
  personalBookLimit: 5
  entriesPerBookLimit: 30
