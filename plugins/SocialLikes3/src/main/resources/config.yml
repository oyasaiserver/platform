# Data source used to initialize the in-memory SocialLikes build cache.
# YAML is safe by default. sqlite is honoured only after the startup ID migration records the
# completion marker; otherwise the plugin warns and continues from YAML.
readSource: yaml

# Whether to copy the plugin's dataFolder to SocialLikes3-backups/startup-<timestamp> on every enable.
backupOnStartup: true

# How many of the most recent startup-* backups to keep. Older ones are deleted after each
# successful backup. Set to a large number (or 0) to effectively disable pruning.
backupKeepCount: 5

# Interval in minutes for periodic dirty build reconciliation (SQLite retry).
reconcileIntervalMinutes: 10

# Negative build ID migration settings (one-shot migration from negative to positive IDs).
# Keep both false unless running the maintenance migration.
# Procedure: stop player access, set migrateNegativeIdsOnStartup: true, choose dry-run or
# execution with migrateNegativeIdsDryRun, start the server, confirm the backup and migration logs,
# stop the server, then set migrateNegativeIdsOnStartup back to false before the next restart.
migrateNegativeIdsOnStartup: false
migrateNegativeIdsDryRun: false

guidebook:
  personalBookLimit: 5
  entriesPerBookLimit: 30

  # 公開時の全体告知。初公開は「新しい旅行ガイド」、告知後に編集して再公開したときは「旅行ガイド更新」。
  # sound はバニラ効果音の namespaced key（"minecraft:" 省略可）。空文字にすると音だけ鳴らさない。
  announce:
    enabled: true
    sound: "entity.player.levelup"
    volume: 0.75
    pitch: 1.0

  # 旅行ガイドブックの配色と文言。booktuner の［設定をコピー］の JSON と同じ中身。書かない項目は既定値。
  # booktuner の［config.yml 用にコピー］の出力を guidebook: の style: 部分に貼り替える。反映はサーバー再起動。
  style:
    options:
      brackets: true
    roles:
      title: {color: "#00AA00", bold: true, underline: false}
      progress: {color: "#00AA00", bold: false, underline: false}
      author: {color: "#555555", bold: false, underline: false}
      nextLabel: {color: "#00AAAA", bold: false, underline: false}
      nextName: {color: "#00AAAA", bold: false, underline: false}
      complete: {color: "#00AA00", bold: true, underline: false}
      desc: {color: "#000000", bold: false, underline: false}
      heading: {color: "#00AA00", bold: true, underline: false}
      entry: {color: "#00AAAA", bold: false, underline: false}
      liked: {color: "#00AA00", bold: false, underline: false}
      unfound: {color: "#AAAAAA", bold: false, underline: false}
      invalid: {color: "#FF5555", bold: false, underline: false}
      sub: {color: "#555555", bold: false, underline: false}
      eTitle: {color: "#00AA00", bold: true, underline: false}
      ePublic: {color: "#00AA00", bold: false, underline: false}
      ePrivate: {color: "#AAAAAA", bold: false, underline: false}
      eButton: {color: "#5555FF", bold: false, underline: false}
      eDanger: {color: "#FF5555", bold: false, underline: true}
      eNote: {color: "#AAAAAA", bold: false, underline: false}
      eEntry: {color: "#000000", bold: false, underline: false}
      eOk: {color: "#00AA00", bold: false, underline: false}
      eNg: {color: "#FF5555", bold: false, underline: false}
      cName: {color: "#FFFFFF", bold: false, underline: false}
      cOfficial: {color: "#FFAA00", bold: false, underline: false}
      cLore: {color: "#AAAAAA", bold: false, underline: false}
