name: DynamicProfile
authors: [Srain3, takucan]
website: "https://github.com/OyasaiServer"
main: com.baakun.dynamicprofile.DynamicProfile
api-version: "1.20"
version: "0.0.1"
depend: [Votifier, Vault, TokenManager]
softdepend: [LuckPerms, SocialLikes3]
permissions:
  oyasai.syokaku:
    description: syokakuコマンドの使用権限
    default: op
  oyasai.syokakumanager:
    description: syokakumanagerコマンドの使用権限
    default: op
  dprofile.basic:
    description: "基本権限、鯖民向け"
    default: true
  dprofile.op:
    description: "設定変更等、OP向け"
commands:
  syokaku:
    description: サブコマンド（promote, demote, getrank, iscandidate, seerequirements, seeplayerinfo）
    usage: |
      /syokaku promote <player>
      /syokaku demote <player>
      /syokaku getrank <player>
      /syokaku iscandidate <player>
      /syokaku seerequirements <rank>
      /syokaku seeplayerinfo <player>
    permission: oyasai.syokaku
  syokakumanager:
    permission: oyasai.syokakumanager
  dpmanager:
    permission: dprofile.op
    aliases: [dpma, dpm]
    description: "DynamicProfileの管理者用コマンド"
  dprofile:
    permission: dprofile.basic
    aliases: [dp, dpr, dpro]
    description: "DynamicProfileのメインコマンド"
  dpleaderboard:
    description: "DynamicProfileの各種ステータスのリーダーボードを表示する"
    permission: dprofile.basic
    aliases: [dpl]
  dpweeklyleaderboard:
    description: "DynamicProfileの各種ステータスの週間リーダーボードを表示する"
    permission: dprofile.basic
    aliases: [dpwl]
  dpsuki:
    description: "おすすめ建築の登録・削除コマンド"
    permission: dprofile.basic
softdepend:
  - SocialLikes3
  - LuckPerms
