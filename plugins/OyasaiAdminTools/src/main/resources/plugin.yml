name: OyasaiAdminTools
version: "1.0-SNAPSHOT"
main: io.oyasai.oyasaiAdminTools.OyasaiAdminTools
api-version: "1.21"
softdepend:
  - AdvancedBan
  - TokenManager
  - WorldBorder
commands:
  ban:
    aliases: ["oyasaiban", "aban", "tempban"]
  syokaku:
    description: サブコマンド（promote, demote, getrank, iscandidate, seerequirements, seeplayerinfo）
    usage: |
      /syokaku promote <player>
      /syokaku demote <player>
      /syokaku getrank <player>
      /syokaku iscandidate <player>
      /syokaku seerequirements <rank>
      /syokaku seeplayerinfo <player>
    permission: oyasai.syokaku
  syokakumanager:
    permission: oyasai.syokakumanager
  playermanager:
    aliases:
      - pm
      - pmanager
    permission: oyasai.playermanager
  kakutyo:
    description: 個人ワールド拡張用マクロ
    usage: /kakutyo <プレイヤー名> <ポイント>
    permission: oyasai.kakutyo
  sv:
    description: アンケート用コマンド
    aliases: [survey, suv]
    usage: /sv <survey_id>
    permission: oyasai.survey
  svo:
    description: 最新のアンケートを開く (短縮用)
    aliases: [suvo, svop]
    permission: oyasai.survey
permissions:
  oyasai.survey:
    description: svコマンドの使用権限
    default: true
  oyasai.admin:
    description: 管理者用権限
    default: op
  oyasai.syokaku:
    description: syokakuコマンドの使用権限
    default: op
  oyasai.syokakumanager:
    description: syokakumanagerコマンドの使用権限
    default: op
  oyasai.playermanager:
    description: playermanagerコマンドの使用権限
    default: op
  oyasai.kakutyo:
    description: kakutyoコマンドの使用権限
    default: op
