webhook-url: ""
worldborder:
  message: "&cYou have reached the edge of this world."
  round-border: false
  whoosh-effect: true
  portal-redirection: true
  knock-back-dist: 3.0
  timer-delay-ticks: 5
  deny-enderpearl: true
staff:
  hide-displayname-in-vanish: true
  sleep-ignores-vanished: true
  world-teleport-permissions: false
  socialspy-commands: [msg, w, r, mail, m, t, whisper, emsg, tell, er, reply, ereply, email, action, describe, eme, eaction, edescribe, etell, ewhisper, pm, message]

assistant:
  brain:
    command: []
  enabled: false
  model: deepseek/deepseek-v4.1-flash
  api-key-env: OYASAI_ASSISTANT_API_KEY
  session-idle-minutes: 10
  session-max-messages: 40
  session-max-chars: 48000
  sender-permissions: []
  player-commands: [tp, teleport, gamemode, gm, gms, gmc, gmsp, gma, fly]
  sender-wait-ms: 1500
  sender-idle-ms: 300
  max-tool-calls: 12
  timeout-seconds: 45
  cooldown-seconds: 10
  # 正規化後のコマンドに追加で適用する正規表現。コードの禁止項目は解除できません。
  blacklist: []
