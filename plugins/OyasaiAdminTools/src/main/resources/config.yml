webhook-url: ""
worldborder:
  message: "&cYou have reached the edge of this world."
  round-border: false
  whoosh-effect: true
  portal-redirection: true
  knock-back-dist: 3.0
  timer-delay-ticks: 5
  deny-enderpearl: true
staff:
  hide-displayname-in-vanish: true
  sleep-ignores-vanished: true
  world-teleport-permissions: false
  socialspy-commands: [msg, w, r, mail, m, t, whisper, emsg, tell, er, reply, ereply, email, action, describe, eme, eaction, edescribe, etell, ewhisper, pm, message]

assistant:
  enabled: false
  sender-permissions: []
  player-commands: [tp, teleport, gamemode, gm, gms, gmc, gmsp, gma, fly, "co i", "co inspect", "co near"]
  sender-wait-ms: 1500
  sender-idle-ms: 300
  max-tool-calls-per-minute: 30
  # 正規化後のコマンドに追加で適用する正規表現。コードの禁止項目は解除できません。
  blacklist: []
