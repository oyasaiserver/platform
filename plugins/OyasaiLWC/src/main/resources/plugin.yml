name: OyasaiLWC
provides: [LWC]
version: ${version}
main: icu.oyasai.lwc.LwcPlugin
api-version: "1.21"
description: ブロック保護プラグイン
commands:
  lock:
    description: ブロックを保護する
    aliases: [cprivate]
    permission: lwc.protect
  cdisplay:
    description: 読み取り専用で保護する
    permission: lwc.protect
  unlock:
    description: 保護を外す
    aliases: [cremove]
    permission: lwc.protect
  cinfo:
    description: 保護情報を見る
    permission: lwc.protect
  cmodify:
    description: 共有相手を変更する
    permission: lwc.protect
  chopper:
    description: HOPPER フラグを変更する
    permission: lwc.protect
permissions:
  lwc.protect:
    description: 保護コマンドの使用
    default: true
  lwc.admin:
    description: すべての保護の管理
    default: op
