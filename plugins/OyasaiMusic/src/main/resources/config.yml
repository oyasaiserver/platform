# OyasaiMusic 設定ファイル

storage:
  # SQLiteデータベースファイル（pluginsフォルダからの相対パス）
  database-file: "database.db"
  # 音源バイナリ(.bin)の保存先ディレクトリ
  audio-directory: "audio"

recording:
  # デフォルトのレコード価格
  default-price: 1000
  # デフォルトのレコード素材（バニラマテリアル名）
  default-record-material: "MUSIC_DISC_13"

playback:
  # デフォルトの再生方式: default(推奨, プレイヤーに音源追従・Panなし) / positional(立体音響再生, Pan対応)
  # 実際にどちらで再生するかは、対応楽曲(songs.supports_positional=true)であれば
  # リスナーごとの選択(playback_preferences)が優先される。この値は選択が無い場合の既定値。
  default-mode: default
  # 音符をメインスレッドへ少し早めに渡し、混雑時の遅延を吸収する（0〜50ms）。
  # 35msは追加タスクを増やさず、通常時のズレも目立ちにくい推奨値。
  lookahead-ms: 35
  # 視聴カウント判定: 直近1時間の再生回数上限
  view-limit-per-hour: 3
  # 視聴カウント判定: 直近24時間の再生回数上限
  view-limit-per-day: 10
  # 視聴回数がこの値に達するたびに作者へpending_pointsを+1
  views-per-point: 10
  # 楽曲の総演奏時間に対して、この割合以上を聴き終えたら1視聴としてカウント
  view-completion-ratio: 0.8

economy:
  # いいね送信者(リスナー)に付与する金額
  like-reward-money: 1000
  # いいね受信者(作者)に付与するポイント
  like-reward-points: 2
  # レコード売上の作者還元率
  record-sale-author-share: 0.8
  # TokenManager 等へポイントを付与するコンソールコマンド。%player% と %points%（または%amount%）を使える。
  # /tokenmanager add <player> <値> に合わせた既定値。%player% と %points%（または%amount%）を使える。
  points-command: "tokenmanager add %player% %points%"

bedrock:
  # 統合版(Geyser/Floodgate)プレイヤーの検知に使う名前接頭辞
  name-prefix: "."
  # 同一ミリ秒・同一楽器の同時発音数がこれ以上の場合、最高音・最低音のみ再生する
  chord-limit: 3

# Players are never prompted by default; `/mm rp allow` is the opt-in entry point.
# This remains optional and must not be duplicated as a forced server.properties pack.
resource-pack:
  enabled: true
  id: "f0666054-e41c-40ef-affb-27bbf1bf79f9"
  url: "https://download.mc-packs.net/pack/af57205743d4d573bcb2dea2f81b745d30eb6eb3.zip"
  sha1: "af57205743d4d573bcb2dea2f81b745d30eb6eb3"
  # SHA-256 of assets/oyasaimusic/ommt-bank-manifest.json in the uploaded pack.
  # Playback uses the expanded bank only when the client reports this exact active manifest.
  bank-manifest-sha256: "8aed26ff23119b34e91f78036c313e3b38f66a4589f11c8af8e58efff3c03d6a"
  prompt: "おやさいサーバーの拡張音域リソースパックを読み込みますか？"
  # The pack builder emits one event per instrument/F# anchor pair.
  # Tokens: {instrument}=stable runtime id (0..19), {anchor}=m36, m12, p36 or p60.
  instrument-bank-event-template: "oyasaimusic:bank/i/{instrument}/a/{anchor}"
