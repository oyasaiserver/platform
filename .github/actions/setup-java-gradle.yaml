name: Setup Java and Gradle

on:
  workflow_call:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          cache: gradle
          distribution: oracle
          java-version: "24"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
