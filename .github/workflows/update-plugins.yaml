name: Update Plugins

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: "nix-eval-cache-${{ runner.os }}-${{ runner.arch }}"
          path: "~/.cache/nix"
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            extra-substituters = ${{ vars.NIX_CACHE_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      - uses: ./packages/oyasai-secrets-action
        with:
          env-slug: common
          project-slug: platform
          identity-id: "c3685c4e-acbd-4668-aca0-1920d1e0c83d"
          secrets: |
            CLOUDFLARE_ACCESS_KEY_ID
            CLOUDFLARE_SECRET_ACCESS_KEY
            NIX_CACHE_SIGNING_KEY
      - name: Configure Cloudflare R2 credentials
        run: |
          sudo -i aws configure set aws_access_key_id "$CLOUDFLARE_ACCESS_KEY_ID"
          sudo -i aws configure set aws_secret_access_key "$CLOUDFLARE_SECRET_ACCESS_KEY"
      - name: Run update
        working-directory: packages/oyasai-plugin-registry
        run: |
          nix run .#oyasai-plugin-registry -- 26.2 >lock.json
      - name: Create PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/plugin-registry-automatic-update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Delete branch if it exists (from previous failed run)
          git branch -D "$BRANCH" || true
          git switch -c "$BRANCH"

          git add -A

          if ! git status --porcelain | grep -q .; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore(oyasai-plugin-registry): update lockfile"

          git push -f -u origin "$BRANCH"

          PR_URL=$(gh pr create --fill)
          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')
          gh pr merge --squash --auto "$PR_NUMBER"
