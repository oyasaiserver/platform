name: PR

on:
  pull_request:

jobs:
  merging-into-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Ensure target branch is main
        run: |
          [[ "$GITHUB_BASE_REF" == main ]]

  pr-title:
    runs-on: ubuntu-latest
    steps:
      - run: |
          <<<"$PR_TITLE" grep '^\(build\|chore\|ci\|docs\|feat\|fix\|perf\|p\?refactor\|revert\|style\|test\)\(([a-zA-Z0-9_-]\+)\)\?!\?: '
        env:
          PR_TITLE: "${{ github.event.pull_request.title }}"
