name: Release SocialLikes3 timestamp migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type MIGRATE_TIMESTAMPS to stop main, migrate its DB, and deploy"
        required: true
        type: string

permissions:
  actions: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: production-sociallikes3-timestamp-release
  cancel-in-progress: false

jobs:
  push-to-ghcr:
    uses: ./.github/workflows/push-to-ghcr.yaml
    secrets: inherit

  release:
    needs: push-to-ghcr
    runs-on: ubuntu-latest
    environment: master
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Validate release request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$CONFIRMATION" == "MIGRATE_TIMESTAMPS" ]]
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: "nix-eval-cache-${{ runner.os }}-${{ runner.arch }}"
          path: "~/.cache/nix"

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-substituters = ${{ vars.NIX_CACHE_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ vars.NIX_CACHE_PUBLIC_KEY }}

      - uses: ./packages/oyasai-secrets-action
        with:
          env-slug: common
          project-slug: platform
          identity-id: "c3685c4e-acbd-4668-aca0-1920d1e0c83d"
          secrets: |
            INFISICAL_TOKEN
            TF_API_TOKEN
            TF_TOKEN_app_terraform_io
            TLS_CA_PEM
            TLS_CERT_PEM
            TLS_KEY_PEM

      - name: Configure remote Docker TLS
        run: |
          cert_dir="$RUNNER_TEMP/oyasai-docker-certs"
          install -d -m 700 "$cert_dir"
          printf '%s' "$TLS_CA_PEM" >"$cert_dir/ca.pem"
          printf '%s' "$TLS_CERT_PEM" >"$cert_dir/cert.pem"
          printf '%s' "$TLS_KEY_PEM" >"$cert_dir/key.pem"
          chmod 600 "$cert_dir"/*.pem
          {
            echo "DOCKER_HOST=tcp://oyasai.io:2376"
            echo "DOCKER_TLS_VERIFY=1"
            echo "DOCKER_CERT_PATH=$cert_dir"
          } >>"$GITHUB_ENV"

      - name: Resolve immutable candidate image
        run: |
          tags_file="$(nix build --no-link --print-out-paths .#all-docker-tags)"
          candidate="$(awk '$1 == "oyasai-minecraft-main" { print $2 }' "$tags_file")"
          [[ "$candidate" == ghcr.io/oyasaiserver/oyasai-minecraft-main:* ]]
          echo "CANDIDATE_IMAGE=$candidate" >>"$GITHUB_ENV"

      - name: Authenticate remote Docker pull
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Stop, migrate, deploy, verify, or roll back
        run: plugins/SocialLikes3/tools/run-production-timestamp-release.sh

      - name: Record production timestamp schema version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh api --method PATCH "/repos/$REPOSITORY/actions/variables/SOCIALLIKES3_TIMESTAMP_SCHEMA_VERSION" \
            -f name=SOCIALLIKES3_TIMESTAMP_SCHEMA_VERSION -f value=1; then
            exit 0
          fi
          gh api --method POST "/repos/$REPOSITORY/actions/variables" \
            -f name=SOCIALLIKES3_TIMESTAMP_SCHEMA_VERSION -f value=1
