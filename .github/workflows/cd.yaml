name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "⚠️ Deploy to production ⚠️"
        required: true
        default: production
        type: choice
        options:
          - production
          - development

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - id: env
        # language=bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=development" >> "$GITHUB_OUTPUT"
          fi

  build-and-upload-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - run: ./gradlew build --parallel
      - name: flatten-and-collect-jars
        # language=bash
        run: |
          mkdir -p __temp_flat_plugins_dir__ 
          find plugins -name "*.jar" -exec cp {} __temp_flat_plugins_dir__/ \;
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: __temp_flat_plugins_dir__
          retention-days: 1

  deploy-apps:
    needs:
      - resolve-env
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    strategy:
      matrix:
        app: [ wiki, sociallikes ]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: |
          npm run build --if-present
          secrets wrangler deploy --name ${{ matrix.app }}-${{ needs.resolve-env.outputs.environment }}
        working-directory: apps/${{ matrix.app }}
        env:
          ENVIRONMENT: ${{ needs.resolve-env.outputs.environment }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}

  cdktf:
    needs:
      - resolve-env
      - deploy-apps
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - uses: hashicorp/setup-terraform@v3
      - run: |
          npm run build
          npm run deploy
        working-directory:
          infra/cdktf
        env:
          ENVIRONMENT: ${{ needs.resolve-env.outputs.environment }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}

