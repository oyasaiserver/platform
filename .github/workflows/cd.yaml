name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: '⚠️ Deploy to production ⚠️'
        required: true
        default: production
        type: choice
        options:
          - production
          - development

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - id: env
        # language=bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=development" >> "$GITHUB_OUTPUT"
          fi

  deploy-apps:
    needs:
      - resolve-env
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    strategy:
      matrix:
        app: [api, wiki, sociallikes]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: |
          npm run build --if-present
          npm run deploy -- --name ${{ matrix.app }}-${{ needs.resolve-env.outputs.environment }}
        working-directory: apps/${{ matrix.app }}
        env:
          ENVIRONMENT: ${{ needs.resolve-env.outputs.environment }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}

  cdktf:
    needs:
      - resolve-env
      - deploy-apps
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - uses: hashicorp/setup-terraform@v3
      - run: |
          npm run build
          npm run deploy
        working-directory: infra/cdktf
        env:
          ENVIRONMENT: ${{ needs.resolve-env.outputs.environment }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}

  deploy-onprem:
    needs:
      - resolve-env
      - cdktf
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: |
          npm run build
          npm run deploy
        working-directory: packages/core
        env:
          ENVIRONMENT: ${{ needs.resolve-env.outputs.environment }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
