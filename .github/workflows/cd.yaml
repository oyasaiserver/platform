name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: '⚠️ Manual deploy ⚠️'
        required: true
        default: production
        type: choice
        options:
          - production
          - development

jobs:
  envs:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.environment.outputs.ENVIRONMENT }}
    steps:
      - id: environment
        run: |
          ENVIRONMENT="development"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          fi
          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

  deploy-apps:
    needs:
      - envs
    runs-on: ubuntu-latest
    environment: ${{ needs.envs.outputs.environment }}
    strategy:
      matrix:
        app:
          - dashboard
          - hello-world
          - wiki
    env:
      ENVIRONMENT: ${{ needs.envs.outputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: |
          npm run build --if-present
          npm run deploy -- --name ${{ matrix.app }}-${{ needs.envs.outputs.environment }}
        working-directory: apps/${{ matrix.app }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }},
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }},

  cdktf:
    needs:
      - envs
      - deploy-apps
    runs-on: ubuntu-latest
    environment: ${{ needs.envs.outputs.environment }}
    env:
      ENVIRONMENT: ${{ needs.envs.outputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-terraform
      - name: Build plugins
        run: |
          ./gradlew build --parallel
      - name: Download plugins
        run: |
          npm run download:plugins
        working-directory: packages/minecraft-server
      - name: Deploy infra
        run: |
          npm run build
          npm run deploy
        working-directory: packages/cdktf
        env:
          PUBLIC_IPV4: ${{ secrets.PUBLIC_IPV4 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          GH_APP_PEM_FILE: ${{ secrets.GH_APP_PEM_FILE }}
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          RCON_PASSWORD: ${{ secrets.RCON_PASSWORD }}
          MARIADB_PASSWORD: ${{ secrets.MARIADB_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TLS_CA_PEM: ${{ secrets.TLS_CA_PEM }}
          TLS_CERT_PEM: ${{ secrets.TLS_CERT_PEM }}
          TLS_KEY_PEM: ${{ secrets.TLS_KEY_PEM }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}

  actions-timeline:
    needs:
      - envs
      - deploy-apps
      - cdktf
    runs-on: ubuntu-latest
    steps:
      - uses: Kesin11/actions-timeline@v2
