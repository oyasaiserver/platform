name: CD
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: "⚠️ Manual deploy ⚠️"
        required: true
        default: production
        type: choice
        options:
          - production
          - development
jobs:
  envs:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.environment.outputs.ENVIRONMENT }}
    steps:
      - id: environment
        run: |
          ENVIRONMENT="development"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          fi
          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
  cdktf:
    needs:
      - envs
    runs-on: ubuntu-latest
    environment: ${{ needs.envs.outputs.environment }}
    env:
      ENVIRONMENT: ${{ needs.envs.outputs.environment }}
    steps:
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          key: "nix-eval-cache-${{ runner.os }}-${{ runner.arch }}"
          path: "~/.cache/nix"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1
        with:
          name: oyasaiserver
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - uses: infisical/secrets-action@v1.0.15
        with:
          project-slug: "platform"
          env-slug: ${{ env.ENVIRONMENT }}
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      - name: Deploy
        run: |
          # NOMERGE
          nix run .#oyasai-cdktf -- synth
        working-directory: packages/cdktf
