name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: '⚠️ Deploy to production ⚠️'
        required: true
        default: production
        type: choice
        options:
          - production
          - development

jobs:
  envs:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.environment.outputs.environment }}
    steps:
      - id: environment
        # language=bash
        run: |
          ENVIRONMENT="development"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          fi
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

  deploy-apps:
    needs:
      - envs
    runs-on: ubuntu-latest
    environment: ${{ needs.envs.outputs.environment }}
    strategy:
      matrix:
        app: [api, wiki, sociallikes]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: |
          npm run build --if-present
          npm run deploy -- --name ${{ matrix.app }}-${{ needs.envs.outputs.environment }} > /dev/null
        working-directory: apps/${{ matrix.app }}
        env:
          ENVIRONMENT: ${{ needs.envs.outputs.environment }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}

  cdktf:
    needs:
      - envs
      - deploy-apps
    runs-on: ubuntu-latest
    environment: ${{ needs.envs.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - uses: hashicorp/setup-terraform@v3
      - run: |
          npm run build
          npm run deploy
        working-directory: infra/cdktf
        env:
          ENVIRONMENT: ${{ needs.envs.outputs.environment }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}

  deploy-onprem:
    needs:
      - envs
      - cdktf
    runs-on: ubuntu-latest
    environment: ${{ needs.envs.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-node
      - run: |
          ./gradlew build --parallel
          npm run start -w packages/deploy
        env:
          ENVIRONMENT: ${{ needs.envs.outputs.environment }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
