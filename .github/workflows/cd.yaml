name: CD
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: "⚠️ Manual deploy ⚠️"
        required: true
        default: production
        type: choice
        options:
          - production
          - development
jobs:
  envs:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.environment.outputs.ENVIRONMENT }}
    steps:
      - id: environment
        run: |
          ENVIRONMENT="development"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          fi
          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
  cdktf:
    needs:
      - envs
    runs-on: ubuntu-latest
    environment: ${{ needs.envs.outputs.environment }}
    env:
      ENVIRONMENT: ${{ needs.envs.outputs.environment }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup-nix
        with:
          nix-cache-public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          nix-cache-signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          substituter: ${{ vars.NIX_CACHE_SUBSTITUTER }}
      # FIXME: super ugly, non-nix deployment. Fix my nixifying cdktf (or switching to terranix)
      - uses: nicknovitski/nix-develop@5da6ac475f1ffbcf54ee562fa3056646e146be95
      - name: Build plugins
        run: |
          gradle build --parallel
      - name: Download plugins deps
        run: |
          npm ci
        working-directory: packages/oyasai-plugin-registry
      - name: Build cdktf providers
        run: |
          npm ci
          npm run build
        working-directory: packages/oyasai-cdktf-providers
      - name: Download cdktf deps
        run: |
          npm ci
        working-directory: packages/cdktf
      - name: Download plugins
        run: |
          npm ci
          npm run download-plugins
        working-directory: packages/minecraft-main
      - uses: infisical/secrets-action@v1.0.15
        with:
          project-slug: "platform"
          env-slug: ${{ env.ENVIRONMENT }}
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      - name: Deploy
        run: |
          npm run synth
          npm run deploy
        working-directory: packages/cdktf
