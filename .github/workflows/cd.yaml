name: CD
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: "⚠️ Manual deploy ⚠️"
        required: true
        default: production
        type: choice
        options:
          - production
          - development
jobs:
  envs:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.environment.outputs.ENVIRONMENT }}
    steps:
      - id: environment
        run: |
          ENVIRONMENT="development"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          fi
          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
  cdktf:
    needs:
      - envs
    runs-on: ubuntu-latest
    environment: ${{ needs.envs.outputs.environment }}
    env:
      ENVIRONMENT: ${{ needs.envs.outputs.environment }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39
      # FIXME: super ugly, non-nix deployment. Fix my nixifying cdktf (or switching to terranix)
      - uses: nicknovitski/nix-develop@5da6ac475f1ffbcf54ee562fa3056646e146be95
      - name: Build plugins
        run: |
          gradle build --parallel
      - name: Download plugins deps
        run: |
          npm ci
        working-directory: packages/plugin-registry
      - name: Download cdktf deps
        run: |
          npm ci
        working-directory: packages/cdktf
      - name: Download plugins
        run: |
          npm ci
          npm run download-plugins
        working-directory: packages/minecraft-main
      - uses: infisical/secrets-action@v1.0.15
        with:
          project-slug: "platform"
          env-slug: ${{ env.ENVIRONMENT }}
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      - name: Deploy
        run: |
          npm run synth
          npm run deploy
        working-directory: packages/cdktf
  actions-timeline:
    needs:
      - envs
      - cdktf
    runs-on: ubuntu-latest
    steps:
      - uses: Kesin11/actions-timeline@v2
