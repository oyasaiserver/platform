name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "⚠️ Deploy to production ⚠️"
        required: true
        default: production
        type: choice
        options:
          - production

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - id: env
        # language=bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=development" >> "$GITHUB_OUTPUT"
          fi

  upload-plugins:
    runs-on: ubuntu-latest
    env:
      DIR: flat-plugins
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - run: ./gradlew build --parallel
      - name: Flatten and collect JARs
        run: |
          mkdir -p ${{ env.DIR }}
          find plugins -name "*.jar" -exec cp {} ${{ env.DIR }}/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: ${{ env.DIR }}
          retention-days: 1

  cdktf:
    needs:
      - resolve-env
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - uses: hashicorp/setup-terraform@v3
      - run: |
          npm run get -w infra/cdktf
          npm run synth -w infra/cdktf
          npm run deploy -w infra/cdktf
        env:
          ENVIRONMENT: ${{ needs.resolve-env.outputs.environment }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}

  publish-package-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        # language=bash
      - run: |
          # reify envs
          rm -rf packages/server/envs
          cp -rf envs packages/server/envs
          # reify compose
          rm -rf packages/server/compose
          cp -rf compose packages/server/compose
          # publish
          npm publish -w packages/server

  build-infra-onprem-image:
    runs-on: ubuntu-latest
    needs:
      - resolve-env
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/infra-onprem
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        # language=bash
      - run: |
          SHA=$(git rev-parse --short HEAD)
          docker build -f infra/onprem/Dockerfile \
            -t $IMAGE_NAME:latest \
            --build-arg SHA=$SHA \
            .
          docker push $IMAGE_NAME:latest

  deploy-onprem-infra:
    needs:
      - resolve-env
      - upload-plugins
      - cdktf
      - publish-package-server
      - build-infra-onprem-image
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run deploy -w packages/server
        env:
          ENVIRONMENT: ${{ needs.resolve-env.outputs.environment }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}

  actions-timeline:
    runs-on: ubuntu-latest
    needs:
      - resolve-env
      - upload-plugins
      - publish-package-server
      - cdktf
      - build-infra-onprem-image
      - deploy-onprem-infra
    steps:
      - uses: Kesin11/actions-timeline@v2