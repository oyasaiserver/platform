name: Deploy platform

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      start-proxy:
        type: boolean
        required: false

jobs:
  push-to-ghcr:
    uses: ./.github/workflows/push-to-ghcr.yaml
    secrets: inherit

  infra:
    needs: push-to-ghcr
    uses: ./.github/workflows/modify-platform-stack.yaml
    secrets: inherit
    with:
      stack: platform-${{ inputs.environment }}-infra
      environment: ${{ inputs.environment }}
      operation: deploy

  services:
    needs: infra
    uses: ./.github/workflows/modify-platform-stack.yaml
    secrets: inherit
    with:
      stack: platform-${{ inputs.environment }}-services
      environment: ${{ inputs.environment }}
      operation: deploy
      cancel-in-progress: ${{ inputs.environment != 'master' }}
      start-proxy: ${{ inputs.start-proxy }}
