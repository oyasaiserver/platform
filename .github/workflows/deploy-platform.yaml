name: Deploy platform

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      start-proxy:
        type: boolean
        required: false

jobs:
  migration-gate:
    runs-on: ubuntu-slim
    steps:
      - name: Require the protected timestamp release for production
        if: inputs.environment == 'master' && vars.SOCIALLIKES3_TIMESTAMP_SCHEMA_VERSION != '1'
        run: |
          echo "Production deploy is blocked until the SocialLikes3 timestamp migration workflow succeeds." >&2
          exit 1

  infra:
    needs: migration-gate
    uses: ./.github/workflows/modify-platform-stack.yaml
    secrets: inherit
    with:
      stack: platform-${{ inputs.environment }}-infra
      environment: ${{ inputs.environment }}
      operation: deploy

  services:
    needs: infra
    uses: ./.github/workflows/modify-platform-stack.yaml
    secrets: inherit
    with:
      stack: platform-${{ inputs.environment }}-services
      environment: ${{ inputs.environment }}
      operation: deploy
      cancel-in-progress: ${{ inputs.environment != 'master' }}
      start-proxy: ${{ inputs.start-proxy }}
