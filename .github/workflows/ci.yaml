name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  PLUGIN_ARTIFACT_NAME: plugins
  PLUGIN_ARTIFACTS_DIR: flat-plugins

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - run: ./gradlew spotlessCheck --parallel
      - uses: ./.github/actions/setup-node
      - run: |
          npm run check
          npm run typecheck

  cdktf-no-drift:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [ production, development ]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - run: npm run load-env -w packages/env
      - uses: hashicorp/setup-terraform@v3
      - run: npm run diff -w infra/cdktf
        env:
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}

  build-and-upload-plugins:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - run: ./gradlew build --parallel
      - name: Flatten and collect JARs
        run: |
          mkdir -p ${{ env.PLUGIN_ARTIFACTS_DIR }}
          find plugins -name "*.jar" -exec cp {} ${{ env.PLUGIN_ARTIFACTS_DIR }}/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_ARTIFACT_NAME }}
          path: ${{ env.PLUGIN_ARTIFACTS_DIR }}
          retention-days: 1
