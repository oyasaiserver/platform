name: CI
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  nocommit:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: nobssoftware/nocommit@5c3cf9519fe40b80b0954d254085b67b532a5dc3

  nix-flake-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup-nix
        with:
          nix-cache-public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          nix-cache-signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          substituter: ${{ vars.NIX_CACHE_SUBSTITUTER }}
      - run: nix run .#nix-flake-check-changed

  nix-flake-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup-nix
        with:
          nix-cache-public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          nix-cache-signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          substituter: ${{ vars.NIX_CACHE_SUBSTITUTER }}
      - run: nix flake show
      - run: nix flake lock --no-update-lock-file
      - run: nix flake check --no-build

  nix-devshell:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup-nix
        with:
          nix-cache-public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          nix-cache-signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          substituter: ${{ vars.NIX_CACHE_SUBSTITUTER }}
      - uses: nicknovitski/nix-develop@5da6ac475f1ffbcf54ee562fa3056646e146be95

  nix-devshell-windows:
    # Windows runner is slow because it can't use nix cache: run only on master.
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: vampire/setup-wsl@6a8db447be7ed35f2f499c02c6e60ff77ef11278
        with:
          distribution: Ubuntu-24.04
      - run: sh <(curl --proto '=https' --tlsv1.2 -L https://nixos.org/nix/install) --daemon
      - run: |
          . /etc/profile.d/nix.sh
          nix --extra-experimental-features 'nix-command flakes' develop

  push-to-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup-nix
        with:
          nix-cache-public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          nix-cache-signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          substituter: ${{ vars.NIX_CACHE_SUBSTITUTER }}
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: nix run .#oyasai-push-nix-images
