name: CI
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  nocommit:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: nobssoftware/nocommit@5c3cf9519fe40b80b0954d254085b67b532a5dc3

  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          key: "nix-eval-cache-${{ runner.os }}-${{ runner.arch }}"
          path: "~/.cache/nix"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe
        with:
          extra_nix_config: |
            extra-substituters = s3://nix-cache?scheme=https&region=auto&endpoint=7befe273c79e6f7993c1cd4534d6afff.r2.cloudflarestorage.com
            extra-trusted-public-keys = ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      - uses: nix-ocaml/nix-s3-action@84d7b6415d8603e815741fe77f0aaffa22736d4b
        with:
          endpoint: s3://nix-cache?scheme=https&region=auto&endpoint=7befe273c79e6f7993c1cd4534d6afff.r2.cloudflarestorage.com
          signingKey: "${{ secrets.NIX_CACHE_SIGNING_KEY }}"
          awsAccessKeyId: "${{ vars.AWS_ACCESS_KEY_ID }}"
          awsSecretAccessKey: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
      - name: Make R2 credentials accessible to nix-daemon
        run: |
          sudo  -i aws configure set aws_access_key_id "${{ vars.AWS_ACCESS_KEY_ID }}"
          sudo -i aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          sudo -i aws configure set region "auto"
      - run: nix run .#nix-flake-check-changed

  nix-flake-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          key: "nix-eval-cache-${{ runner.os }}-${{ runner.arch }}"
          path: "~/.cache/nix"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c
        with:
          name: oyasaiserver
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix flake show
      - run: nix flake lock --no-update-lock-file
      - run: nix flake check --no-build

  nix-devshell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          key: "nix-eval-cache-${{ runner.os }}-${{ runner.arch }}"
          path: "~/.cache/nix"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c
        with:
          name: oyasaiserver
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - uses: nicknovitski/nix-develop@5da6ac475f1ffbcf54ee562fa3056646e146be95

  nix-devshell-windows:
    # Windows runner is slow because it can't use nix cache: run only on master.
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: vampire/setup-wsl@6a8db447be7ed35f2f499c02c6e60ff77ef11278
        with:
          distribution: Ubuntu-24.04
      - run: sh <(curl --proto '=https' --tlsv1.2 -L https://nixos.org/nix/install) --daemon
      - run: |
          . /etc/profile.d/nix.sh
          nix --extra-experimental-features 'nix-command flakes' develop

  push-to-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          key: "nix-eval-cache-${{ runner.os }}-${{ runner.arch }}"
          path: "~/.cache/nix"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c
        with:
          name: oyasaiserver
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: nix run .#oyasai-push-nix-images
