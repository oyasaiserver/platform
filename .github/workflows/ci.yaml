name: CI

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-node
      - run: |
          ./gradlew spotlessCheck --parallel &
          npm run check &
          wait

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run build

  codegen-no-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run codegen
      - run: npm run check
      - run: git diff --exit-code

  actions-timeline:
    runs-on: ubuntu-latest
    needs:
      - format
      - typecheck
      - codegen-no-drift
    steps:
      - uses: Kesin11/actions-timeline@v2