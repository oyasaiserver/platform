name: CI

on:
  push:
    branches:
      - main

env:
  PLUGIN_ARTIFACT_NAME: plugins
  PLUGIN_ARTIFACTS_DIR: flat-plugins

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          cache: gradle
          distribution: oracle
          java-version: "24"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json

  check:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./gradlew spotlessCheck --parallel
      - run: npm install
      - run: npm run check
      - run: npm run typecheck

  build-and-upload-plugins:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./gradlew build --parallel
      - name: Flatten and collect JARs
        run: |
          mkdir -p ${{ env.PLUGIN_ARTIFACTS_DIR }}
          find plugins -name "*.jar" -exec cp {} ${{ env.PLUGIN_ARTIFACTS_DIR }}/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_ARTIFACT_NAME }}
          path: ${{ env.PLUGIN_ARTIFACTS_DIR }}
          retention-days: 1