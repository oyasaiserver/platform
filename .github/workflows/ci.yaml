name: CI

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  nocommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: nobssoftware/nocommit@v3

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-node
      - run: |
          ./gradlew spotlessCheck --parallel
          npm run lint
          npm run format
          test -z "$(git status --porcelain)"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-node
      - run: |
          npm run build
          ./gradlew build --parallel

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/setup-node
      - run: |
          npm run test --workspaces --if-present

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-terraform
      - run: |
          npm run test:integration --workspaces --if-present

  cdktf-no-drift:
    runs-on: ubuntu-latest
    name: 'cdktf-no-drift-${{ matrix.stack }}-${{ matrix.environment }}'
    strategy:
      fail-fast: true
      matrix:
        stack: ['secrets']
        environment: ['development', 'production']
    env:
      ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-terraform
      - uses: ./.github/actions/setup-secrets
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      - run: |
          npm run diff:${{ matrix.stack }}
        working-directory: packages/cdktf
        env:
          TF_CLI_ARGS_plan: '-detailed-exitcode'

  actions-timeline:
    needs:
      - nocommit
      - check
      - build
      - test-unit
      - test-integration
    runs-on: ubuntu-latest
    steps:
      - uses: Kesin11/actions-timeline@v2
