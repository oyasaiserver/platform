name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-node
      - run: |
          ./gradlew spotlessCheck --parallel
          npm run check
          npm run build

  codegen-no-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: |
          npm run codegen
          npm run check
          git diff --exit-code

  asdf:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: homebrew/actions/setup-homebrew@master
      - run: |
          sh ./scripts/setup.sh
          source ~/.zshrc || true
          source ~/.bashrc || true
          npm ci
          npm run verify-asdf -w tests

  build-and-upload-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - run: ./gradlew build --parallel
      - uses: ./.github/actions/upload-plugins

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v4
        with:
          # specified at actions/upload-plugins
          name: plugins
      - run: |
          npm run test:integration -w tests

  actions-timeline:
    runs-on: ubuntu-latest
    needs:
      - check
      - codegen-no-drift
      - asdf
      - build-and-upload-plugins
    steps:
      - uses: Kesin11/actions-timeline@v2