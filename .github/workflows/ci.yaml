name: CI

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-node
      - run: |
          ./gradlew spotlessCheck --parallel &
          npm run check &
          wait

  asdf:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        shell: [ bash, zsh ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run setup
        shell: ${{ matrix.shell }}
        run: ./scripts/setup.sh

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run build

  codegen-no-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: |
          npm run codegen
          npm run check
          git diff --exit-code

  build-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - run: ./gradlew build --parallel

  actions-timeline:
    runs-on: ubuntu-latest
    needs:
      - format
      - typecheck
      - codegen-no-drift
      - build-plugins
    steps:
      - uses: Kesin11/actions-timeline@v2