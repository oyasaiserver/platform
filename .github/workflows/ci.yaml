name: CI

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-node
      - run: |
          ./gradlew spotlessCheck --parallel &
          npm run check &
          wait

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run build

  codegen-no-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: |
          npm run codegen
          npm run check
          git diff --exit-code

  asdf:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: homebrew/actions/setup-homebrew@master
      - run: |
          sh ./scripts/setup.sh
          source ~/.zshrc || true
          source ~/.bashrc || true
          npm ci
          npm run verify-asdf -w scripts

  build-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - run: ./gradlew build --parallel

  run-server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [ development, production ]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-java
        env:
          ENVIRONMENT: ${{ matrix.environment }}
      - run: |
          # reify envs
          rm -rf packages/core/envs
          cp -rf envs packages/core/envs
          npm run start -w packages/core

  actions-timeline:
    runs-on: ubuntu-latest
    needs:
      - format
      - typecheck
      - codegen-no-drift
      - asdf
      - build-plugins
    steps:
      - uses: Kesin11/actions-timeline@v2