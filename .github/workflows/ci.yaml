name: CI
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  nocommit:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: nobssoftware/nocommit@5c3cf9519fe40b80b0954d254085b67b532a5dc3

  nix-flake-check:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: "nix-eval-cache-${{ runner.os }}-${{ runner.arch }}"
          path: "~/.cache/nix"
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            extra-substituters = ${{ vars.NIX_CACHE_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      - uses: ./packages/oyasai-secrets-action
        with:
          env-slug: common
          project-slug: platform
          identity-id: "c3685c4e-acbd-4668-aca0-1920d1e0c83d"
          secrets: |
            CLOUDFLARE_ACCESS_KEY_ID
            CLOUDFLARE_SECRET_ACCESS_KEY
            NIX_CACHE_SIGNING_KEY
      - name: Configure Cloudflare R2 credentials
        run: |
          sudo -i aws configure set aws_access_key_id "$CLOUDFLARE_ACCESS_KEY_ID"
          sudo -i aws configure set aws_secret_access_key "$CLOUDFLARE_SECRET_ACCESS_KEY"
      - run: nix run .#nix-flake-check-changed
      - run: nix run .#nix-copy-to-s3
        if: always()
        env:
          NIX_CACHE_SUBSTITUTER: ${{ vars.NIX_CACHE_SUBSTITUTER }}

  nix-flake-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: "nix-eval-cache-${{ runner.os }}-${{ runner.arch }}"
          path: "~/.cache/nix"
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - run: nix flake show
      - run: nix flake lock --no-update-lock-file
      - run: nix flake check --no-build

  nix-devshell:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: "nix-eval-cache-${{ runner.os }}-${{ runner.arch }}"
          path: "~/.cache/nix"
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            extra-substituters = ${{ vars.NIX_CACHE_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      - uses: ./packages/oyasai-secrets-action
        with:
          env-slug: common
          project-slug: platform
          identity-id: "c3685c4e-acbd-4668-aca0-1920d1e0c83d"
          secrets: |
            CLOUDFLARE_ACCESS_KEY_ID
            CLOUDFLARE_SECRET_ACCESS_KEY
            NIX_CACHE_SIGNING_KEY
      - name: Configure Cloudflare R2 credentials
        run: |
          sudo -i aws configure set aws_access_key_id "$CLOUDFLARE_ACCESS_KEY_ID"
          sudo -i aws configure set aws_secret_access_key "$CLOUDFLARE_SECRET_ACCESS_KEY"
      - uses: nicknovitski/nix-develop@5da6ac475f1ffbcf54ee562fa3056646e146be95
      - run: nix run .#nix-copy-to-s3
        if: always()
        env:
          NIX_CACHE_SUBSTITUTER: ${{ vars.NIX_CACHE_SUBSTITUTER }}

  non-nix-development:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@1dbac3c9e137b6d4d280bae1ae4e9902bb4ce1b9
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: |
          ./gradlew build --parallel
          ./gradlew fmt
          ./gradlew lock

          if git status --porcelain | grep . ; then
            >&2 echo "Gradle-native workflow is drifting from Nix".
            exit 1
          fi
        env:
          _JAVA_OPTIONS: -Xmx8g -Xms1g -XX:MaxMetaspaceSize=512m

  push-to-ghcr:
    uses: ./.github/workflows/push-to-ghcr.yaml
    secrets: inherit

  deploy:
    # TODO: enable merge deploy
    if: github.event_name == 'pull_request'
    secrets: inherit
    needs: push-to-ghcr
    uses: ./.github/workflows/deploy-platform.yaml
    with:
      environment: pr-${{ github.event.pull_request.number }}
