name: Modify platform stack

on:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true
      environment:
        type: string
        required: true
      operation:
        type: string
        required: true
      cancel-in-progress:
        type: boolean
        required: false
        default: false
      start-proxy:
        type: boolean
        required: false
        default: false
      restore-from-master:
        type: boolean
        required: false
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ inputs.stack }}
      cancel-in-progress: ${{ inputs.cancel-in-progress }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: packages/oyasai-cdktf
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Free Disk Space
        if: inputs.restore-from-master
        uses: endersonmenezes/free-disk-space@0ccff0c25686603b5721b1202f9fe8964a34bea5
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          key: "nix-eval-cache-${{ runner.os }}-${{ runner.arch }}"
          path: "~/.cache/nix"
      - uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f
        with:
          extra_nix_config: |
            extra-substituters = ${{ vars.NIX_CACHE_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      - name: Install aws cli
        run: |
          nix profile add nixpkgs#awscli2
      - name: Configure Cloudflare R2 credentials
        run: |
          sudo -i aws configure set aws_access_key_id "${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}"
          sudo -i aws configure set aws_secret_access_key "${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}"
      - name: Setup Nix S3 cache
        uses: ./packages/nix-copy-action
        with:
          endpoint: ${{ vars.NIX_CACHE_SUBSTITUTER }}
          signing-key: "${{ secrets.NIX_CACHE_SIGNING_KEY }}"
      - name: Compute docker image names
        run: |
          nix build .#all-docker-tags.json
          echo "OYASAI_IMAGE_ID=$(<result tee /dev/stderr)" >> "$GITHUB_ENV"
      - uses: ./packages/oyasai-secrets-action
        with:
          env-slug: common
          project-slug: platform
          identity-id: "c3685c4e-acbd-4668-aca0-1920d1e0c83d"
      - name: Restore Minecraft world from master backup
        if: inputs.restore-from-master
        env:
          AWS_ACCESS_KEY_ID: ${{ env.CLOUDFLARE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.CLOUDFLARE_SECRET_ACCESS_KEY }}
          RESTIC_REPOSITORY: "s3:https://${{ env.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com/oyasai-master-platform/minecraft-main-backup"
        run: |
          WORKDIR="/opt/platform/$ENVIRONMENT"
          sudo install -d -o "$USER" -m 755 "$WORKDIR"
          # Restore into $WORKDIR; restic recreates the /data prefix from the snapshot
          nix run nixpkgs#restic -- restore latest --target "$WORKDIR" --verbose
          # Rename /data (restic's restored prefix) to the expected volume mount name
          mv "$WORKDIR/data" "$WORKDIR/minecraft-main"
      - name: Restore MariaDB from master backup
        if: inputs.restore-from-master
        env:
          AWS_ACCESS_KEY_ID: ${{ env.CLOUDFLARE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.CLOUDFLARE_SECRET_ACCESS_KEY }}
        run: |
          WORKDIR="/opt/platform/$ENVIRONMENT"
          sudo install -d -o "$USER" -m 755 "$WORKDIR/mariadb"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Find the latest dump in master's bucket
          LATEST=$(aws s3 ls "s3://oyasai-master-platform/mariadb-backup/" \
            --endpoint-url "$ENDPOINT" \
            | sort | tail -1 | awk '{print $4}')
          # Use .sql.gz extension so MariaDB docker-entrypoint-initdb.d imports it
          aws s3 cp "s3://oyasai-master-platform/mariadb-backup/$LATEST" \
            "$WORKDIR/mariadb/restore.sql.gz" \
            --endpoint-url "$ENDPOINT"
      - name: Create TF Workspace
        if: inputs.operation == 'deploy'
        run: |
          nix run .#oyasai-infra -- \
            terraform_io::create_workspace \
            ${{ inputs.stack }}
      - name: ${{ inputs.operation }}
        run: |
          nix run .#oyasai-cdktf -- \
            ${{ inputs.operation }} \
            ${{ inputs.stack }} \
            --ignore-missing-stack-dependencies \
            --auto-approve
      - name: Delete TF Workspace
        if: inputs.operation == 'destroy'
        run: |
          nix run .#oyasai-infra -- \
            terraform_io::delete_workspace \
            ${{ inputs.stack }}
      - name: Start Proxy
        if: inputs.start-proxy
        # It's free, feel free to increase
        # timeout-minutes: 20 NOMERGE
        run: |
          docker logs -f minecraft-main &
          while true; do
            nix run .#bore-cli -- local 25565 --to bore.pub
            echo "bore disconnected, reconnecting in 5s..."
            sleep 5
          done
