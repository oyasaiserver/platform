# TODO: an absolute kitchen sink
name: Modify platform stack

on:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true
      environment:
        type: string
        required: true
      operation:
        type: string
        required: true
      cancel-in-progress:
        type: boolean
        required: false
        default: false
      start-proxy:
        type: boolean
        required: false
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ inputs.stack }}
      cancel-in-progress: ${{ inputs.cancel-in-progress }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: packages/oyasai-cdktf
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: "nix-eval-cache-${{ runner.os }}-${{ runner.arch }}"
          path: "~/.cache/nix"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-substituters = ${{ vars.NIX_CACHE_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      - uses: ./packages/oyasai-secrets-action
        with:
          env-slug: common
          project-slug: platform
          identity-id: "c3685c4e-acbd-4668-aca0-1920d1e0c83d"
          secrets: |
            CLOUDFLARE_ACCESS_KEY_ID
            CLOUDFLARE_SECRET_ACCESS_KEY
            GRAFANA_CLOUD_ACCESS_POLICY_TOKEN
            TF_API_TOKEN
            TF_TOKEN_app_terraform_io
            CLOUDFLARE_API_TOKEN
            NIX_CACHE_SIGNING_KEY
            INFISICAL_TOKEN
      - name: Configure Cloudflare R2 credentials
        run: |
          sudo -i aws configure set aws_access_key_id "$CLOUDFLARE_ACCESS_KEY_ID"
          sudo -i aws configure set aws_secret_access_key "$CLOUDFLARE_SECRET_ACCESS_KEY"
      - name: Create TF Workspace
        if: inputs.operation == 'deploy'
        run: |
          nix run .#oyasai-infra -- \
            terraform_io::create_workspace \
            ${{ inputs.stack }}
      - name: ${{ inputs.operation }}
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          STACK: ${{ inputs.stack }}
        run: |
          # Docker API への接続が一時的に timeout しただけで、旧コンテナを止めた
          # まま deploy が中断することがあった。その場合に限り再実行する。
          # Terraform は途中まで進んだ状態から続きを apply する。
          max=1
          [[ "$OPERATION" == deploy ]] && max=3
          for attempt in $(seq "$max"); do
            log="$RUNNER_TEMP/$OPERATION-$attempt.log"
            set +e
            nix run .#oyasai-cdktf -- \
              "$OPERATION" \
              "$STACK" \
              --ignore-missing-stack-dependencies \
              --auto-approve 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set -e
            (( rc == 0 )) && exit 0
            grep -Eq 'dial tcp [^ ]+:2376: i/o timeout' "$log" || exit "$rc"
            # state を保存できなかった場合は、Docker と state がずれているので再実行しない
            grep -Eqi 'Failed to save state|Failed to persist state|Error acquiring the state lock|errored\.tfstate' "$log" && exit "$rc"
            (( attempt < max )) || exit "$rc"
            echo "::warning::Docker API timeout (attempt $attempt/$max), retrying in 30s"
            sleep 30
          done
      - name: Delete TF Workspace
        if: inputs.operation == 'destroy'
        run: |
          nix run .#oyasai-infra -- \
            terraform_io::delete_workspace \
            ${{ inputs.stack }}
      - run: nix run .#nix-copy-to-s3
        env:
          NIX_CACHE_SUBSTITUTER: ${{ vars.NIX_CACHE_SUBSTITUTER }}
      - name: Start Proxy
        if: inputs.start-proxy
        # It's free, feel free to increase
        timeout-minutes: 30
        run: |
          docker logs -f minecraft-main &
          nix run .#bore-cli -- local 25565 \
            --to bore.pub
