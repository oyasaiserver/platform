name: Deploy

on:
  pull_request:
    types:
      - labeled
      - opened
      - synchronize

jobs:
  deploy:
    if: contains(github.event.pull_request.labels.*.name, 'deploy')
    secrets: inherit
    uses: ./.github/workflows/deploy-platform.yaml
    with:
      environment: pr-${{ github.event.pull_request.number }}
      start-proxy: true
