services:
  portical:
    image: danielbodart/portical:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: host
    command: /opt/portical/run poll
  mariadb:
    image: mariadb:10.4.28
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: pigg1524
    volumes:
      - ./mariadb:/var/lib/mysql
      - ./mariadb:/docker-entrypoint-initdb.d
  minecraft-main:
    depends_on:
      - mariadb
      - portical
    image: itzg/minecraft-server:java24
    ports:
      - 25565:25565/tcp
      - 19132:19132/udp
    labels:
      - portical.upnp.forward=25565/tcp,19132/udp
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      EULA: true
      TYPE: PURPUR
      VERSION: 1.21.5
      USE_MEOWICE_FLAGS: true
      ENABLE_ROLLING_LOGS: true
      LOG_TIMESTAMP: true
      MEMORY: 32G
      ICON: https://avatars.githubusercontent.com/oyasaiserver
    volumes:
      - ./minecraft-main:/data
    env_file: .env
    extra_hosts:
      - host.docker.internal:host-gateway
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - 9090:9090
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
  grafana:
    image: grafana/grafana
    ports:
      - 3000:3000
    volumes:
      - grafana_data:/var/lib/grafana
  node-exporter:
    image: prom/node-exporter:v1.9.1
    ports:
      - 9100:9100
    network_mode: host
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
