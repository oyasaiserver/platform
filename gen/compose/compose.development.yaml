services:
  minecraft-main:
    image: itzg/minecraft-server:java24
    ports:
      - 25566:25565
    tty: true
    stdin_open: true
    environment:
      EULA: true
      TYPE: PURPUR
      VERSION: 1.21.5
      ENABLE_ROLLING_LOGS: true
      LOG_TIMESTAMP: true
      MEMORY: 12G
      ICON: https://avatars.githubusercontent.com/oyasaiserver
    volumes:
      - ./minecraft-main:/data
    env_file: .env
    extra_hosts:
      - host.docker.internal:host-gateway
  mysql:
    image: mariadb:10.4.28
    ports:
      - 3308:3306
    environment:
      MYSQL_ROOT_PASSWORD: pigg1524
    volumes:
      - ./mysql:/var/lib/mysql
