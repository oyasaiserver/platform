services:
  minecraft-main:
    image: itzg/minecraft-server:java24
    ports:
      - 25566:25565
    volumes:
      - ./minecraft-main:/data
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      EULA: 'TRUE'
      TYPE: PURPUR
      VERSION: 1.21.5
      ICON: https://avatars.githubusercontent.com/oyasaiserver
    env_file: .env
    extra_hosts:
      - host.docker.internal:host-gateway
