# Detailed explanation of all options available at https://github.com/NEZNAMY/TAB/wiki/config.yml
header-footer:
  enabled: true
  header:
    - '&8&m============================='
    - '&7&l&o&nOYASAI&f&l&oSERVER &7&l&o1.21'
    - '&bLikes&7：&6%SocialLikes3_ReceivedLikeCount%'
  footer:
    - ''
    - '&7&o¥&r&2%vault_eco_balance_commas% &f|&r &3%tm_tokens_commas%&7&oP'
    - ''
    - '&a%online%&f &7players online &f| &f%tps% &7TPS'
    - '&7Total &6%sociallikes3_ALLLikeCount% &7Likes &f| &2%sociallikes3_ALLBuildingCount%
      &7SLIDs'
    - '&8&m=============================='
  per-world:
    world1:
      header:
        - an example of world with custom
      footer:
        - header/footer and prefix/suffix
  disable-condition: '%world%=disabledworld'
tablist-name-formatting:
  enabled: true
  anti-override: true
  disable-condition: '%world%=disabledworld'
scoreboard-teams:
  enabled: true
  invisible-nametags: false
  anti-override: true
  enable-collision: true
  unlimited-nametag-mode:
    enabled: false
    disable-on-boats: true
    space-between-lines: true
    dynamic-lines:
      - abovename
      - nametag
      - belowname
      - another
    static-lines:
      myCustomLine: 0.66
    disable-condition: '%world%=disabledworld'
  case-sensitive-sorting: true
  sorting-types:
    - GROUPS:white,blue,takumi,builder,jokyu,chukyu,default,mod,admini,admin,dev
    - PLACEHOLDER_A_TO_Z:%player%
  can-see-friendly-invisibles: false
  disable-condition: '%world%=disabledworld'
belowname-objective:
  enabled: false
  number: '%health%'
  text: Health
  disable-condition: '%world%=disabledworld'
  fancy-display-default: NPC
  fancy-display-players: '&c%health%'
bossbar:
  enabled: false
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: false
  bars:
    ServerInfo:
      refresh: 1000
      style: PROGRESS
      color: '%animation:barcolors%'
      progress: '100'
      text: '&fWebsite: &bwww.domain.com'
      announcement-bar: false
    test:
      refresh: 100
      style: PROGRESS
      color: WHITE
      progress: '%animation:test%'
      text: test
      display-condition: '%world%=testworld'
      announcement-bar: false
scoreboard:
  enabled: false
  toggle-command: /sb
  remember-toggle-choice: false
  hidden-by-default: false
  use-numbers: false
  static-number: 0
  delay-on-join-milliseconds: 0
  respect-other-plugins: true
  scoreboards:
    admin:
      display-condition: permission:tab.scoreboard.admin
      title: Admin scoreboard
      lines:
        - '%animation:MyAnimation1%'
        - '&6Online:'
        - '* &eOnline&7: &f%online%&7/&4%maxplayers%'
        - '* &eCurrent World&7: &f%worldonline%'
        - '* &eStaff&7: &f%staffonline%'
        - ' '
        - '&6Server Info:'
        - '* &bTPS&7: %tps%'
        - '* &bUptime&7: &f%server_uptime%'
        - '* &bMemory&7: &f%memory-used%&7/&4%memory-max%'
        - '%animation:MyAnimation1%'
    scoreboard1:
      title: Default
      lines:
        - '%animation:MyAnimation1%'
        - '&6My Stats:'
        - '* &eKills&7: &f%statistic_player_kills%'
        - '* &eDeaths&7: &f%statistic_deaths%'
        - '* &eHealth&7: &f%health%'
        - ' '
        - '&6Personal Info:'
        - '* &bRank&7: &f%group%'
        - '* &bPing&7: &f%ping%&7ms'
        - '* &bWorld&7: &f%world%'
        - '%animation:MyAnimation1%'
prevent-spectator-effect:
  enabled: false
placeholder-output-replacements:
  '%essentials_vanished%':
    'yes': '&7| Vanished'
    'no': ''
  '%afk%':
    'true': ''
    'false': ''
  '%player-version%':
    1.19.3: '&eAbove 1.18! 最新'
    1.18.1: '&eAbove 1.18! 最新'
    '1.18': '&eAbove 1.18! 最新'
    else: '&dClient outdated!'
conditions:
  nick:
    conditions:
      - '%player%=%essentials_nickname%'
    'yes': '%player%'
    'no': ~%essentials_nickname%
placeholders:
  date-format: dd.MM.yyyy
  time-format: '[HH:mm:ss / h:mm a]'
  time-offset: 0
  register-tab-expansion: true
placeholderapi-refresh-intervals:
  default-refresh-interval: 1000
assign-groups-by-permissions: false
primary-group-finding-list:
  - Owner
  - Admin
  - Helper
  - default
debug: false
mysql:
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: tab
  username: user
  password: password
per-world-playerlist:
  enabled: false
use-online-uuid-in-tablist: true
global-playerlist:
  enabled: false
layout:
  enabled: false
  direction: COLUMNS
  default-skin: mineskin:1753261242
  enable-remaining-players-text: true
  remaining-players-text: '... and %s more'
  empty-slot-ping-value: 1000
  layouts:
    staff:
      condition: permission:tab.staff
      fixed-slots:
        - '1|&3RAM&f:'
        - 2|&b%memory-used%MB / %memory-max%MB
        - '3|&8&m                       '
        - '4|&3TPS&f:'
        - 5|&b%tps%
      groups:
        staff:
          condition: permission:tab.staff
          slots:
            - 24-40
        players:
          slots:
            - 44-80
    default:
      fixed-slots:
        - '1|&3Website&f:'
        - 2|&bmyserver.net
        - '3|&8&m                       '
        - '4|&3Name&f:'
        - 5|&b%player%
        - '7|&3Rank&f:'
        - '8|Rank: %group%'
        - '10|&3World&f:'
        - 11|&b%world%
        - '13|&3Time&f:'
        - 14|&b%time%
        - '21|&3Teamspeak&f:'
        - 22|&bts.myserver.net
        - '23|&8&m                       '
        - '41|&3Store&f:'
        - 42|&bshop.myserver.net
        - '43|&8&m                       '
      groups:
        staff:
          condition: permission:tab.staff
          slots:
            - 24-40
        players:
          slots:
            - 44-80
permission-refresh-interval: 1000
playerlist-objective:
  enabled: true
  value: '%ping%'
  disable-condition: '%world%=disabledworld'
  fancy-value: '&e%ping%'
ping-spoof:
  enabled: false
