party:
  # The amount of votes needed
  votes_needed: 50

  # The command that will be executed when the number of votes is reached for each online players
  global_commands:
    - 'tm give %player% 20'

  commands:
    - 'eco give * 0.0000000009'

  # Rewards that players can earn
  rewards:
    1:
      percent: 50
      commands:
        - 'eco give %player% 10000'
    2:
      percent: 50
      commands:
        - 'cr give %player% test'

