menu-settings:
  name: '&l&9&lユーザー設定'
  rows: 6
  commands:
    - menuosettings
  auto-refresh: 5
  open-with-item:
    material: wool:1
    left-click: false
    right-click: true
chat:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: chat.yml'
  NAME: '&l&5{player}&l(プロフィール)'
  LORE:
    - 'プレイヤープロフィールを確認'
  MATERIAL: player_head
  SKULL-OWNER: '{player}'
  POSITION-X: 1
  POSITION-Y: 6
ucommand1:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: ucommand1.yml'
  NAME: '&l&c&lユーザーコマンド 1'
  LORE:
    - '各種ユーザーコマンドを実行'
  MATERIAL: red_concrete_powder
  POSITION-X: 2
  POSITION-Y: 6
ucommand2:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: ucommand2.yml'
  NAME: '&l&6&lユーザーコマンド 2'
  LORE:
    - '各種ユーザーコマンドを実行'
  MATERIAL: orange_concrete_powder
  POSITION-X: 3
  POSITION-Y: 6
shop:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: shop.yml'
  NAME: '&l&e&lサーバーショップ'
  LORE:
    - '建材や装飾、鉱石の売買'
    - 'ポイントとマイルの交換'
  MATERIAL: yellow_concrete_powder
  POSITION-X: 4
  POSITION-Y: 6
sociallikes:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: sociallikes.yml'
  NAME: '&a&lSocialLikes'
  LORE:
    - '建築管理システム'
    - '自分の建築、すべての建築へクリックでテレポート'
  MATERIAL: lime_concrete_powder
  POSITION-X: 5
  POSITION-Y: 6
carbuilder:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: carbuilder.yml'
  NAME: '&l&3&lCarBuilder1 & AirCraftBuilder'
  LORE:
    - 'ユーザー車両建造プラグイン'
    - 'スポーン、カスタム、車両設定など'
  MATERIAL: cyan_concrete_powder
  POSITION-X: 6
  POSITION-Y: 6
settings:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: menu.yml'
  NAME: '&l&9&lユーザー設定'
  LORE:
    - '椅子のON/OFF、TP許可設定など'
  MATERIAL: blue_concrete_powder
  POSITION-X: 7
  POSITION-Y: 6
links:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: links.yml'
  NAME: '&l&5&lリンク'
  LORE:
    - 'ルール確認、Wikiやdynmap、Discordの参加リンクはこちら'
  MATERIAL: purple_concrete_powder
  POSITION-X: 8
  POSITION-Y: 6
painttools:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: painttools.yml'
  NAME: '&l&d&lお絵描き'
  LORE:
    - 'お絵描きツールの入手はこちらから'
  MATERIAL: pink_concrete_powder
  POSITION-X: 9
  POSITION-Y: 6

lang:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - menulang
  NAME: '&9&lLanguage'
  LORE:
    - Change your language
  MATERIAL: filled_map
  POSITION-X: 7
  POSITION-Y: 5
chairs:
  ACTIONS:
    - sit toggle
  # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
  NAME: '&9椅子に座る'
  MATERIAL: oak_stairs
  LORE:
  POSITION-X: 7
  POSITION-Y: 4
oresmelt:
  ACTIONS:
    - os toggle
  # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
  NAME: '&9自動精錬切り替え'
  MATERIAL: diamond_pickaxe
  LORE:
    - '&c幸運ピッケルを使う際はOFFにしてください'
  POSITION-X: 7
  POSITION-Y: 3
getmenu:
  ACTIONS:
    - getmenu
  # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
  NAME: '&9メニューアイテムを入手'
  LORE:
    - 'メニューブックを'
    - 'インベントリに入手'
  ENCHANTMENTS:
    - efficiency, 114514
  MATERIAL: book
  POSITION-X: 7
  POSITION-Y: 2
