    - getvehicleitem
  # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
  NAME: '&eメニューアイテムを入手'
  LORE:
    - '現在のページを開く省略用アイテムを'
    - 'インベントリに入手する'
  ENCHANTMENTS:
    - efficiency, 114514
  MATERIAL: book
  POSITION-X: 1
  POSITION-Y: 1
openmenu:
