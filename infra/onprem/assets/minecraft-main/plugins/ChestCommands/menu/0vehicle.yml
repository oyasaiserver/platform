menu-settings:
  name: '移動'
  rows: 6
  commands:
    - 1vmenu
  auto-refresh: 5
  open-actions:
    - 'tell: &eメニューを開きました'
  open-with-item:
    material: wool:1
    left-click: false
    right-click: true
spawncmd:
  ACTIONS:
    - spawn
  NAME: '&e/spawn'
  LORE:
    - 'スポーン地点に戻ります'
  MATERIAL: redbed
  POSITION-X: 9
  POSITION-Y: 6
getmenu:
