menu-settings:
  name: '&l&#996633チャット切り替え'
  rows: 6
  commands:
    - menuochat
  auto-refresh: 5
  open-with-item:
    material: wool:1
    left-click: false
    right-click: true
chat:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: menu.yml'
  NAME: '&l&5{player}&l(プロフィール)'
  LORE:
    - 'プレイヤープロフィールを確認'
  MATERIAL: player_head
  SKULL-OWNER: '{player}'
  POSITION-X: 1
  POSITION-Y: 6
ucommand1:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: ucommand1.yml'
  NAME: '&l&c&lユーザーコマンド 1'
  LORE:
    - '各種ユーザーコマンドを実行'
  MATERIAL: red_concrete_powder
  POSITION-X: 2
  POSITION-Y: 6
ucommand2:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: ucommand2.yml'
  NAME: '&l&6&lユーザーコマンド 2'
  LORE:
    - '各種ユーザーコマンドを実行'
  MATERIAL: orange_concrete_powder
  POSITION-X: 3
  POSITION-Y: 6
shop:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: shop.yml'
  NAME: '&l&e&lサーバーショップ'
  LORE:
    - '建材や装飾、鉱石の売買'
    - 'ポイントとマイルの交換'
  MATERIAL: yellow_concrete_powder
  POSITION-X: 4
  POSITION-Y: 6
sociallikes:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: sociallikes.yml'
  NAME: '&a&lSocialLikes'
  LORE:
    - '建築管理システム'
    - '自分の建築、すべての建築へクリックでテレポート'
  MATERIAL: lime_concrete_powder
  POSITION-X: 5
  POSITION-Y: 6
carbuilder:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: carbuilder.yml'
  NAME: '&l&3&lCarBuilder1 & AirCraftBuilder'
  LORE:
    - 'ユーザー車両建造プラグイン'
    - 'スポーン、カスタム、車両設定など'
  MATERIAL: cyan_concrete_powder
  POSITION-X: 6
  POSITION-Y: 6
settings:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: settings.yml'
  NAME: '&l&9&lユーザー設定'
  LORE:
    - '椅子のON/OFF、TP許可設定など'
  MATERIAL: blue_concrete_powder
  POSITION-X: 7
  POSITION-Y: 6
links:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: links.yml'
  NAME: '&l&5&lリンク'
  LORE:
    - 'ルール確認、Wikiやdynmap、Discordの参加リンクはこちら'
  MATERIAL: purple_concrete_powder
  POSITION-X: 8
  POSITION-Y: 6
painttools:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: painttools.yml'
  NAME: '&l&d&lお絵描き'
  LORE:
    - 'お絵描きツールの入手はこちらから'
  MATERIAL: pink_concrete_powder
  POSITION-X: 9
  POSITION-Y: 6

chat1:
  ACTIONS:
    - 'leave 2'
    - 'leave 3'
    - 'join Global'
    - 'tell: &lチャットルーム #1'
    - 'chwho Global'
  NAME: '&#996633&lチャットルーム #1'
  LORE:
    - 'チャットルーム #1'
  MATERIAL: name_tag
  POSITION-X: 1
  POSITION-Y: 5
chat2:
  ACTIONS:
    - 'leave Global'
    - 'leave 3'
    - 'join 2'
    - 'tell: &lチャットルーム #2'
    - 'chwho 2'
  NAME: '&#996633&lチャットルーム #2'
  LORE:
    - 'チャットルーム #2'
  MATERIAL: name_tag
  POSITION-X: 1
  POSITION-Y: 4
chat3:
  ACTIONS:
    - 'leave Global'
    - 'leave 2'
    - 'join 3'
    - 'tell: &lチャットルーム #3'
    - 'chwho 3'
  NAME: '&#996633&lチャットルーム #3'
  LORE:
    - 'チャットルーム #3'
  MATERIAL: name_tag
  POSITION-X: 1
  POSITION-Y: 3
chatmember:
  ACTIONS:
    - 'console: tellraw {player} {"text":"\u30c1\u30e3\u30c3\u30c8\u30eb\u30fc\u30e0#1","bold":true,"color":"gold"}'
    - 'chwho Global'
    - 'console: tellraw {player} {"text":"\u30c1\u30e3\u30c3\u30c8\u30eb\u30fc\u30e0#2","bold":true,"color":"gold"}'
    - 'chwho 2'
    - 'console: tellraw {player} {"text":"\u30c1\u30e3\u30c3\u30c8\u30eb\u30fc\u30e0#3","bold":true,"color":"gold"}'
    - 'chwho 3'
    - 'console: tellraw {player} [{"text":"---------------------------------------------","bold":true,"color":"yellow"},{"text":"\n\u30c1\u30e3\u30c3\u30c8\u30eb\u30fc\u30e0\u306e\u5207\u308a\u66ff\u3048\u306f/menu\u304b\u3089\u304a\u9858\u3044\u3057\u307e\u3059 \u3054\u81ea\u7531\u306b\u304a\u4f7f\u3044\u4e0b\u3055\u3044\n"},{"text":"\u304a\u3084\u3055\u3044\u9bd6Discord","underlined":true,"color":"blue","clickEvent":{"action":"open_url","value":"https://discord.gg/jX337YjJMD"}},{"text":"  ","color":"blue"},{"text":"\u304a\u3084\u3055\u3044\u9bd6wiki","underlined":true,"clickEvent":{"action":"open_url","value":"http://wiki.baakun.com/"}},{"text":"  "},{"text":"MAP","underlined":true,"clickEvent":{"action":"open_url","value":"http://baakun.com:8100/"}}]'
  NAME: '&#996633&lチャットルームのメンバーを表示'
  LORE:
    - 'ここをクリックしてチャットルームの人数を表示'
  MATERIAL: ender_eye
  NBT-DATA: '{SkullOwner:{Id:[I;2131935260,49957882,-1552063214,2007687133],Properties:{textures:[{Value:"eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGYzZjZiMjg0ZTc3YTVlMDMyMzRmMDQ4NWM5NTU5NDI4NTAyYzlmZDM4MzUzNDEzYzlhMDI3YTJjYmY3YzhjMiJ9fX0="}]}}}'
  POSITION-X: 1
