tools:
  ACTIONS:
    - tools
  # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
  NAME: '&eツールショップ'
  LORE:
    - 'ツールの入手はここで'
  MATERIAL: diamond_pickaxe
  POSITION-X: 4
  POSITION-Y: 2
pshop:
  ACTIONS:
    - pshop
  # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
  NAME: '&eポイント - ショップ'
  LORE:
    - '&6ポイントを利用してアイテム購入と権限解除'
  MATERIAL: nether_star
  POSITION-X: 4
  POSITION-Y: 1

