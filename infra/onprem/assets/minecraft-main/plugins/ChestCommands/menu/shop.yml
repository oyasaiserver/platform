menu-settings:
  name: '&l&eサーバーショップ'
  rows: 6
  commands:
    - menushopyml
  auto-refresh: 5
  open-with-item:
    material: wool:1
    left-click: false
    right-click: true
chat:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: chat.yml'
  NAME: '&l&5{player}(プロフィール)'
  LORE:
    - 'プレイヤープロフィールを確認'
  MATERIAL: player_head
  SKULL-OWNER: '{player}'
  POSITION-X: 1
  POSITION-Y: 6
ucommand1:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: ucommand1.yml'
  NAME: '&l&cユーザーコマンド 1'
  LORE:
    - '各種ユーザーコマンドを実行'
  MATERIAL: red_concrete_powder
  POSITION-X: 2
  POSITION-Y: 6
ucommand2:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: ucommand2.yml'
  NAME: '&l&6ユーザーコマンド 2'
  LORE:
    - '各種ユーザーコマンドを実行'
  MATERIAL: orange_concrete_powder
  POSITION-X: 3
  POSITION-Y: 6
shop:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: menu.yml'
  NAME: '&l&eサーバーショップ'
  LORE:
    - '建材や装飾、鉱石の売買'
    - 'ポイントとマイルの交換'
  MATERIAL: yellow_concrete_powder
  POSITION-X: 4
  POSITION-Y: 6
sociallikes:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: sociallikes.yml'
  NAME: '&aSocialLikes'
  LORE:
    - '建築管理システム'
    - '自分の建築、すべての建築へクリックでテレポート'
  MATERIAL: lime_concrete_powder
  POSITION-X: 5
  POSITION-Y: 6
carbuilder:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: carbuilder.yml'
  NAME: '&l&3CarBuilder1 & AirCraftBuilder'
  LORE:
    - 'ユーザー車両建造プラグイン'
    - 'スポーン、カスタム、車両設定など'
  MATERIAL: cyan_concrete_powder
  POSITION-X: 6
  POSITION-Y: 6
settings:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: settings.yml'
  NAME: '&l&9ユーザー設定'
  LORE:
    - '椅子のON/OFF、TP許可設定など'
  MATERIAL: blue_concrete_powder
  POSITION-X: 7
  POSITION-Y: 6
links:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: links.yml'
  NAME: '&l&5リンク'
  LORE:
    - 'ルール確認、Wikiやdynmap、Discordの参加リンクはこちら'
  MATERIAL: purple_concrete_powder
  POSITION-X: 8
  POSITION-Y: 6
painttools:
  ACTIONS:
    # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: painttools.yml'
  NAME: '&l&dお絵描き'
  LORE:
    - 'お絵描きツールの入手はこちらから'
  MATERIAL: pink_concrete_powder
  POSITION-X: 9
  POSITION-Y: 6

blocks:
  ACTIONS:
    - blockshop
  # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
  NAME: '&e建材ブロック - ショップ'
  LORE:
    - '建材ショップを開きます'
  MATERIAL: bricks
  POSITION-X: 4
  POSITION-Y: 5
decoration:
  ACTIONS:
    - decorationsshop
  # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
  NAME: '&e装飾 - ショップ'
  LORE:
    - '装飾アイテムショップを開きます'
  MATERIAL: peony
  POSITION-X: 4
  POSITION-Y: 4
ore:
  ACTIONS:
    - oreshop
  # - 'sound: UI_STONECUTTER_SELECT_RECIPE'
  NAME: '&e鉱石 - ショップ'
  LORE:
    - '鉱石の売買はここから'
    - ''
    - '&8スマホ版非対応(Pocket Edition)'
    - '&8スマホの方は中央商店街へ'
  MATERIAL: Diamond
  POSITION-X: 4
  POSITION-Y: 3
