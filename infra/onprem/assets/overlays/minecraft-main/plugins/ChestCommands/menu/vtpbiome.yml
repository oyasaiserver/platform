menu-settings:
  name: '&a[lang]cc.sociallikes[/lang]'
  rows: 6
  commands:
    - menusociallikes
  auto-refresh: 5
  open-with-item:
    material: wool:1
    left-click: false
    right-click: true
chat:
  ACTIONS:
    - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: chat.yml'
  NAME: '&l&5{player}[lang]cc.chat[/lang]'
  LORE:
    - '[lang]cc.chatd[/lang]'
  MATERIAL: player_head
  SKULL-OWNER: '{player}'
  POSITION-X: 1
  POSITION-Y: 6
ucommand1:
  ACTIONS:
    - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: ucommand1.yml'
  NAME: '&l&c[lang]cc.command[/lang] 1'
  LORE:
    - '[lang]cc.commandd[/lang]'
  MATERIAL: red_concrete_powder
  POSITION-X: 2
  POSITION-Y: 6
ucommand2:
  ACTIONS:
    - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: ucommand2.yml'
  NAME: '&l&6[lang]cc.command[/lang] 2'
  LORE:
    - '[lang]cc.commandd[/lang]'
  MATERIAL: orange_concrete_powder
  POSITION-X: 3
  POSITION-Y: 6
shop:
