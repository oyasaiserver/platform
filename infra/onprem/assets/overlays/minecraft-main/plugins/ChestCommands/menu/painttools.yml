menu-settings:
  name: '&l&d[lang]cc.painttools[/lang]'
  rows: 6
  commands:
    - menuopaint
  auto-refresh: 5
  open-with-item:
    material: wool:1
    left-click: false
    right-click: true
chat:
  ACTIONS:
    - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: chat.yml'
  NAME: '&l&5{player}[lang]cc.chat[/lang]'
  LORE:
    - '[lang]cc.chatd[/lang]'
  MATERIAL: player_head
  SKULL-OWNER: '{player}'
  POSITION-X: 1
  POSITION-Y: 6
ucommand1:
  ACTIONS:
    - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: ucommand1.yml'
  NAME: '&l&c[lang]cc.command[/lang] 1'
  LORE:
    - '[lang]cc.commandd[/lang]'
  MATERIAL: red_concrete_powder
  POSITION-X: 2
  POSITION-Y: 6
ucommand2:
  ACTIONS:
    - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: ucommand2.yml'
  NAME: '&l&6[lang]cc.command[/lang] 2'
  LORE:
    - '[lang]cc.commandd[/lang]'
  MATERIAL: orange_concrete_powder
  POSITION-X: 3
  POSITION-Y: 6
shop:
  ACTIONS:
    - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: shop.yml'
  NAME: '&l&e[lang]cc.shop[/lang]'
  LORE:
    - '[lang]cc.shopd[/lang]'
    - '[lang]cc.shopd1[/lang]'
  MATERIAL: yellow_concrete_powder
  POSITION-X: 4
  POSITION-Y: 6
sociallikes:
  ACTIONS:
    - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: sociallikes.yml'
  NAME: '&a[lang]cc.sociallikes[/lang]'
  LORE:
    - '[lang]cc.sociallikesd[/lang]'
    - '[lang]cc.sociallikesd1[/lang]'
  MATERIAL: lime_concrete_powder
  POSITION-X: 5
  POSITION-Y: 6
carbuilder:
  ACTIONS:
    - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: carbuilder.yml'
  NAME: '&l&3[lang]cc.carbuilder[/lang]'
  LORE:
    - '[lang]cc.carbuilderd[/lang]'
    - '[lang]cc.carbuilderd1[/lang]'
  MATERIAL: cyan_concrete_powder
  POSITION-X: 6
  POSITION-Y: 6
settings:
  ACTIONS:
    - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: settings.yml'
  NAME: '&l&9[lang]cc.settings[/lang]'
  LORE:
    - '[lang]cc.settingsd[/lang]'
  MATERIAL: blue_concrete_powder
  POSITION-X: 7
  POSITION-Y: 6
links:
  ACTIONS:
    - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: links.yml'
  NAME: '&l&5[lang]cc.link[/lang]'
  LORE:
    - '[lang]cc.linkd[/lang]'
  MATERIAL: purple_concrete_powder
  POSITION-X: 8
  POSITION-Y: 6
painttools:
  ACTIONS:
    - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: menu.yml'
  NAME: '&l&d[lang]cc.painttools[/lang]'
  LORE:
    - '[lang]cc.painttoolsd[/lang]'
  MATERIAL: pink_concrete_powder
  POSITION-X: 9
  POSITION-Y: 6

canvas:
  ACTIONS:
    - startpaint
    - console: give {player} item_frame 1
    - 'sound: UI_STONECUTTER_SELECT_RECIPE'
  NAME: '&d[lang]menu.canvas[/lang]'
  MATERIAL: flower_banner_pattern
  ENCHANTMENTS:
    - efficiency, 114514
  LORE:
    - '[lang]menu.canvas.d[/lang]'
    - '[lang]menu.canvas.d1[/lang]'
    - '&c[lang]menu.canvas.d2[/lang]'
    - '&c[lang]menu.canvas.d3[/lang]'
  POSITION-X: 9
  POSITION-Y: 5
dye:
  ACTIONS:
    - getdye
    - 'sound: UI_STONECUTTER_SELECT_RECIPE'
  NAME: '&dカラーパレットを入手'
  MATERIAL: shulker_box
  ENCHANTMENTS:
    - efficiency, 114514
  LORE:
    - '&c[lang]menu.canvas.d2[/lang]'
    - '&c[lang]menu.canvas.d3[/lang]'
  POSITION-X: 9
  POSITION-Y: 4
frame:
  ACTIONS:
    - console: give {player} item_frame 1
    - 'sound: UI_STONECUTTER_SELECT_RECIPE'
  NAME: '&dアイテムフレームを入手'
  MATERIAL: item_frame
  ENCHANTMENTS:
    - efficiency, 114514
  LORE:
    - '&c[lang]menu.canvas.d2[/lang]'
    - '&c[lang]menu.canvas.d3[/lang]'
  POSITION-X: 9
  POSITION-Y: 3

