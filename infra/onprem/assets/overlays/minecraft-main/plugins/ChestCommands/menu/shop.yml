  ACTIONS:
    - 'sound: UI_STONECUTTER_SELECT_RECIPE'
    - 'open: settings.yml'
  NAME: '&l&9[lang]cc.settings[/lang]'
  LORE:
    - '[lang]cc.settingsd[/lang]'
  MATERIAL: blue_concrete_powder
  POSITION-X: 7
  POSITION-Y: 6
links:
