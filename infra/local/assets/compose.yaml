services:
  minecraft-production:
    image: itzg/minecraft-server:java24
    restart: unless-stopped
    profiles:
      - production
    ports:
      - "25565:25565"
    environment:
      EULA: TRUE
    volumes:
      - ./minecraft-production:/data

  minecraft-development:
    image: itzg/minecraft-server:java24
    restart: unless-stopped
    profiles:
      - development
    ports:
      - "25566:25566"
    environment:
      EULA: TRUE
    volumes:
      - ./minecraft-development:/data